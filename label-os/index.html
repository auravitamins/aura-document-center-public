    +QF('Sample fee','sampleFee','not stated')+QF('Production days','productionDays','not stated')
    +QF('Shipping method','shipMethod','Express 5 to 8 days')+QF('Payment terms','terms','')
    +QF('Quote valid until','expires','')+QF('Where this came from','source','WhatsApp 9/2, 8:58 PM')+'</div>'
    +'<label class="f" style="margin-top:12px"><span>Notes on this quote</span>'
    +'<textarea class="ed" data-p="'+P+'notes">'+esc(q.notes)+'</textarea></label>';

  if(ls.length){
    h+='<p class="sub" style="margin:18px 0 0">What each run costs</p><div class="scroll"><table><thead><tr>'
      +'<th class="n">Quantity</th><th class="n">Labels</th><th class="n">Plates</th><th class="n">Shipping</th>'
      +'<th class="n">Total</th><th class="n">Real cost each</th></tr></thead><tbody>';
    ls.forEach(l=>{const r=lineCost(q,l);

        +'<td class="n">'+(r.ship?money(r.ship):'<span class="dim">—</span>')+'</td>'

    h+='</tbody></table></div>';

    +'<b>Messages about this quote</b><small>Screenshots keep the numbers checkable later</small></div>';

        +'<td><input class="ed n" type="number" step="0.01" value="'+esc(f.flat)+'" data-p="'+P+'flat" placeholder="0" aria-label="Flat"></td>'
        +'<td><input class="ed n" type="number" step="0.01" value="'+esc(f.perK)+'" data-p="'+P+'perK" placeholder="0" aria-label="Per thousand"></td>'
        +'<td><input class="ed n" type="number" value="'+esc(f.days)+'" data-p="'+P+'days" placeholder="0" aria-label="Days"></td>'
        +'<td><input class="ed" value="'+esc(f.source)+'" data-p="'+P+'source" placeholder="Quote source" aria-label="Source"></td>'
        +'<td class="n fig">'+((has(f.flat)||has(f.perK))?money(freightCost(f,sample)):'<span class="dim">—</span>')+'</td>'
        +'<td><button class="icx noprint" onclick="delFreight(\''+f.id+'\')" aria-label="Remove">'+ic('x',13)+'</button></td></tr>';});
    h+='</tbody></table></div>';
  }
  h+='<p class="hint" style="margin-top:12px"><b>Flat cost</b> is a fixed price for the shipment. '
    +'<b>Per 1,000 labels</b> is for forwarders who charge by weight, and it scales with the run.</p>';

          +'<div class="mini" style="margin:5px 0 0 5px">'+esc(a.id)+'</div>'
          +(cur?'<div class="mini" style="margin-left:5px;color:var(--gain);font-weight:600">Current</div>'
               :'<button class="tbtn sm noprint" style="margin:6px 0 0 3px" onclick="makeCurrent(\''+lb.id+'\',\''+a.id+'\')">Make current</button>')

        +(ev?'<figure class="shot" style="margin:0;width:106px;flex-shrink:0">'

             +'<button class="rm noprint" onclick="rmEvidence(\''+ev.id+'\')" aria-label="Remove artwork file">'+ic('x',12)+'</button></figure>'
            :'<div class="vp" style="display:flex;align-items:center;justify-content:center;color:var(--key4);font-size:11px">no file</div>')
        +'<div class="vb">'
          +'<div class="fgrid" style="gap:9px 14px">'

            +'<label class="chip'+(a.proofApproved?' on':'')+'"><input type="checkbox" '+(a.proofApproved?'checked':'')
              +' onchange="setFlag(\''+a.id+'\',\'proofApproved\',this.checked)" style="accent-color:var(--magenta)">Proof approved</label>'
            +(stock>0?'<span class="chip" style="border-color:#f0dca4;background:#fdf7e6;color:#8a5a00">'+int(stock)+' in stock</span>':'')
          +'</div>'
          +'<label class="f" style="margin-top:9px"><span>Why this version exists</span>'

/* ---------- tab: inventory ---------- */
let invForm={type:'Usage',qty:'',date:'',note:'',reason:'Data correction',from:'available',lotId:'',counted:''};
function invSet(k,v){invForm[k]=v;render();}
function invPost(labelId){
  const t=invForm.type, d=invForm.date||today();
  if(t==='Count adjustment'){
    if(invForm.counted===''){toast('Enter what you actually counted');return;}
    postCount(labelId,invForm.counted,{date:d,note:invForm.note,lotId:invForm.lotId||null});
  }else if(t==='Manual adjustment'){
    if(!num(invForm.qty)){toast('Enter the difference, positive or negative');return;}
    postMovement(labelId,'Manual adjustment',num(invForm.qty),
      {date:d,note:invForm.note,reason:invForm.reason,lotId:invForm.lotId||null});
  }else if(t==='Receipt'){
    const lb=label(labelId);
    postMovement(labelId,'Receipt',invForm.qty,{date:d,note:invForm.note,
      artworkId:lb?lb.currentArtworkId:null,source:LOT_SOURCE.MANUAL});
  }else{
    postMovement(labelId,t,invForm.qty,{date:d,note:invForm.note,from:invForm.from,
      reason:invForm.reason,lotId:invForm.lotId||null});
  }
  invForm.qty='';invForm.counted='';invForm.note='';
  render();
}
function tabInventory(lb){

  const st=stockState(lb), conflicts=artworkConflicts(lb.id);
  let h='';

  conflicts.forEach(c=>{
    h+='<div class="conflict"><h3>Artwork conflict in stock</h3>'
      +'<p><b>'+esc(c.lotId)+'</b> holds '+int(c.available)+' usable labels printed from <b>'
      +esc(c.art?c.art.version:'an older version')+'</b>, while <b>'
      +esc((artwork(lb.currentArtworkId)||{}).version||'a newer version')+'</b> is current. '
      +'Nothing has been changed for you.</p><div class="rowbtns noprint">'
      +'<button class="tbtn" onclick="resolveConflict(\''+lb.id+'\',\''+c.lotId+'\',\'use\')">Approve using the rest</button>'
      +'<button class="tbtn" onclick="resolveConflict(\''+lb.id+'\',\''+c.lotId+'\',\'quarantine\')">Quarantine</button>'
      +'<button class="tbtn" onclick="resolveConflict(\''+lb.id+'\',\''+c.lotId+'\',\'obsolete\')">Mark obsolete</button>'
      +'<button class="tbtn" style="color:var(--flag);border-color:#efbccb" onclick="resolveConflict(\''+lb.id+'\',\''+c.lotId+'\',\'destroy\')">Destroy</button>'
      +'</div></div>';
  });

  h+='<div class="strip">'
    +'<div><div class="l">On hand</div><div class="v">'+int(inv.onHand)+'</div><div class="u">physically here</div></div>'
    +'<div><div class="l">Reserved</div><div class="v">'+int(inv.reserved)+'</div></div>'
    +'<div><div class="l">Quarantined</div><div class="v '+(inv.quarantined?'warn':'')+'">'+int(inv.quarantined)+'</div></div>'
    +'<div><div class="l">Rejected</div><div class="v '+(inv.rejected?'bad':'')+'">'+int(inv.rejected)+'</div></div>'
    +'<div><div class="l">Obsolete</div><div class="v '+(inv.obsolete?'bad':'')+'">'+int(inv.obsolete)+'</div></div>'
    +'<div class="sep"><div class="l">Available</div><div class="v '+(st==='ok'?'good':st==='none'?'':'bad')+'">'+int(inv.available)+'</div>'
      +'<div class="u">free to use</div></div>'
    +'<div class="sep"><div class="l">Awaiting shipment</div><div class="v">'+int(incoming.awaitingShipment)+'</div></div>'
    +'<div class="sep"><div class="l">In transit</div><div class="v">'+int(incoming.inTransit)+'</div></div>'
    +'<div class="sep"><div class="l">Awaiting receipt</div><div class="v '+(incoming.awaitingReceipt?'warn':'')+'">'
      +int(incoming.awaitingReceipt)+'</div></div>'
    +'<div class="sep"><div class="l">Position</div><div class="v">'+int(inv.position)+'</div>'
      +'<div class="u">available + incoming</div></div></div>';
  h+='<p class="hint" style="margin:-8px 0 16px">Reserved, quarantined and obsolete stock is still on hand, it is simply not '
    +'available. The three incoming figures are the same '+int(inv.onOrder)+' on order split by where it is, never counted twice. '
    +'Awaiting receipt is stock that has landed but has not been received yet, so it is not on the shelf.</p>';

  if(inv.unallocated&&inv.unallocated.bal.remaining!==0)
    h+='<div class="warnrow">'+int(inv.unallocated.bal.remaining)+' labels are recorded against this label but not yet '
      +'allocated to a lot. Pick a lot on those movements so the stock is traceable.</div>';

  h+='<div class="cols"><div>';

  /* ---- post a movement ---- */
  const needQty=['Receipt','Usage','Reserve','Release reservation','Quarantine','Release quarantine',
                 'Mark obsolete','Restore from obsolete','Destroy'].indexOf(invForm.type)>=0;
  const capNow=CAPACITY[invForm.type]?capacityFor(lb.id,invForm.type,invForm.from):null;
  h+='<div class="panel"><hgroup><h2>Post a movement</h2><p>Stock only changes through one of these</p></hgroup><div class="in">'
    +'<div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">'
    +'<label class="f"><span>Type</span><select class="ed" onchange="invSet(\'type\',this.value)">'
    +MOVE_TYPES.map(t=>'<option'+(invForm.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select></label>'
    +(invForm.type==='Count adjustment'
      ?'<label class="f"><span>Counted on the shelf</span><input class="ed n" type="number" value="'+esc(invForm.counted)
        +'" oninput="invForm.counted=this.value" placeholder="'+int(inv.onHand)+'"></label>'
      :'<label class="f"><span>'+(invForm.type==='Manual adjustment'?'Difference, + or −':'Quantity')+'</span>'
        +'<input class="ed n" type="number" value="'+esc(invForm.qty)+'" oninput="invForm.qty=this.value" placeholder="0"></label>')
    +'<label class="f"><span>Date</span><input class="ed" type="date" value="'+esc(invForm.date||today())+'" oninput="invForm.date=this.value"></label>'
    +(invForm.type==='Destroy'
      ?'<label class="f"><span>Taken from</span><select class="ed" onchange="invSet(\'from\',this.value)">'

          .map(o=>'<option value="'+o[0]+'"'+(invForm.from===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')

    +(MOVE_ADJ.indexOf(invForm.type)>=0
      ?'<label class="f"><span>Reason</span><select class="ed" onchange="invForm.reason=this.value">'
        +ADJ_REASONS.map(r=>'<option'+(invForm.reason===r?' selected':'')+'>'+r+'</option>').join('')+'</select></label>':'')
    +(lotsFor(lb.id).length>1&&MOVE_ADJ.indexOf(invForm.type)>=0
      ?'<label class="f"><span>Against lot</span><select class="ed" onchange="invForm.lotId=this.value">'

          +esc(l.id)+', '+int(lotBalance(l.id).remaining)+' left</option>').join('')+'</select></label>':'')
    +'<label class="f"><span>Note</span><input class="ed" value="'+esc(invForm.note)+'" oninput="invForm.note=this.value" placeholder="where it went"></label>'

      +'The difference against the '+int(inv.onHand)+' on record is posted as an adjustment, nothing already recorded is erased.'
      +(lotsFor(lb.id).filter(l=>lotBalance(l.id).remaining>0).length>1?' With more than one live lot, say which one the difference belongs to rather than letting it be spread silently.':'')
      +'</p>':'')
    +'</div></div>';

  /* ---- lots ---- */
  h+='<div class="panel"><hgroup><h2>Lots</h2><p>Where each batch came from and what is left of it</p></hgroup><div class="in flush">';
  const lots=lotsFor(lb.id).slice().sort(lotOrder);
  if(!lots.length)h+='<div class="blank"><b>No lots yet</b>Post a receipt and the batch it creates shows up here.</div>';
  else{
    h+='<div class="scroll"><table><thead><tr><th>Lot</th><th>Artwork</th><th>Source</th><th>Received</th>'
      +'<th class="n">Original</th><th class="n">Remaining</th><th class="n">Reserved</th><th class="n">Quarantined</th>'
      +'<th class="n">Rejected</th><th class="n">Obsolete</th><th class="n">Available</th><th class="n">Cost each</th>'
      +'<th>Disposition</th></tr></thead><tbody>';
    lots.forEach(l=>{
      const b=lotBalance(l.id), art=artwork(l.artworkId);
      const stale=l.artworkId&&l.artworkId!==lb.currentArtworkId;
      h+='<tr'+(b.remaining<=0?' style="opacity:.55"':'')+'>'
        +'<td class="fig">'+esc(l.id)+'</td>'
        +'<td>'+(art?'<span class="stamp a-'+esc(art.status)+'">'+esc(art.version)+'</span>':'<span class="dim">—</span>')
          +(stale&&b.available>0?'<div class="mini flagtxt">not current</div>':'')+'</td>'
        +'<td class="dim">'+esc(l.source||'—')+(l.poId?'<div class="mini"><a class="link" onclick="event.stopPropagation();goto(\'po\',\''+l.poId+'\')">'+esc(l.poId)+'</a></div>':'')+'</td>'
        +'<td class="dim">'+fmtDate(l.receivedDate||l.createdDate)+'</td>'
        +'<td class="n">'+int(l.originalQty)+'</td><td class="n fig">'+int(b.remaining)+'</td>'
        +'<td class="n">'+(b.reserved?int(b.reserved):'<span class="dim">—</span>')+'</td>'
        +'<td class="n">'+(b.quarantined?int(b.quarantined):'<span class="dim">—</span>')+'</td>'
        +'<td class="n">'+(b.rejected?'<span class="flagtxt">'+int(b.rejected)+'</span>':'<span class="dim">—</span>')+'</td>'
        +'<td class="n">'+(b.obsolete?int(b.obsolete):'<span class="dim">—</span>')+'</td>'
        +'<td class="n fig">'+int(b.available)+'</td>'
        +'<td class="n">'+(l.unitCost!=null?each(l.unitCost)+'<div class="mini">'+esc(l.costBasis||'')+'</div>':'<span class="dim">—</span>')+'</td>'
        +'<td class="dim">'+(l.disposition?esc(l.disposition):'<span class="dim">—</span>')+'</td></tr>';
    });
    if(inv.unallocated&&inv.unallocated.bal.remaining!==0)
      h+='<tr><td class="fig">Unallocated</td><td class="dim">—</td><td class="dim">not tied to a lot</td><td class="dim">—</td>'
        +'<td class="n">—</td><td class="n fig">'+int(inv.unallocated.bal.remaining)+'</td>'
        +'<td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">—</td>'
        +'<td class="n fig">'+int(inv.unallocated.bal.remaining)+'</td><td class="n">—</td><td class="dim">needs a lot</td></tr>';
    h+='</tbody></table></div>';
    const valued=lots.filter(l=>l.unitCost!=null);
    if(valued.length){
      const v=valued.reduce((a,l)=>a+lotBalance(l.id).remaining*num(l.unitCost),0);
      const allValued=valued.length===lots.filter(l=>lotBalance(l.id).remaining>0).length;
      h+='<div class="in" style="border-top:1px solid var(--rule2)"><p class="hint" style="margin:0">'
        +'Stock value '+money(v)+' based on estimated landed cost'
        +(allValued?'':', and only for the lots that carry a cost. Legacy lots have none, so this is not the whole shelf')
        +'.</p></div>';
    }
  }
  h+='</div></div>';

  /* ---- movements ---- */
  h+='<div class="panel"><hgroup><h2>Movements</h2><p>Newest first. Corrections are posted, never erased</p></hgroup><div class="in flush">';
  const ms=movesFor(lb.id).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))
    ||String(b.id).localeCompare(String(a.id)));
  if(!ms.length)h+='<div class="blank"><b>Nothing recorded</b>Post a receipt to open the first lot.</div>';
  else{
    h+='<div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th class="n">Quantity</th><th>Lot</th>'
      +'<th>Artwork</th><th>Reason</th><th>Note</th><th class="noprint"></th></tr></thead><tbody>';
    ms.forEach(m=>{
      const signed=MOVE_OUT.indexOf(m.type)>=0?-num(m.qty):num(m.qty);
      const isMove=MOVE_STATE.indexOf(m.type)>=0;
      const art=artwork(m.artworkId);
      h+='<tr><td class="dim" style="white-space:nowrap">'+fmtDate(m.date)+'</td>'
        +'<td>'+esc(m.type)+(m.from?'<div class="mini">from '+esc(m.from)+'</div>':'')+'</td>'
        +'<td class="n fig'+(signed<0&&!isMove?' flagtxt':'')+'">'+(isMove?int(num(m.qty)):(signed>0?'+':'')+int(signed))+'</td>'
        +'<td class="mini">'+(m.lotId?esc(m.lotId):'<span class="flagtxt">unallocated</span>')+'</td>'
        +'<td class="mini">'+(art?esc(art.version):'—')+'</td>'
        +'<td class="dim">'+esc(m.reason||'')+'</td>'
        +'<td class="dim">'+esc(m.note||'')+(m.refType==='reversal'?' <span class="mini">reverses '+esc(m.refId)+'</span>':'')+'</td>'
        +'<td class="noprint"><button class="tbtn" onclick="reverseMovement(\''+m.id+'\')">Reverse</button></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div></div>';

  /* ---- cover ---- */
  h+='</div><div class="side"><div class="panel"><hgroup><h2>Cover</h2></hgroup><div class="in">'
    +'<div class="tile" style="border:0;padding:0"><div class="l">Available runs out in</div>'
    +'<div class="v">'+(cv!=null?Math.round(cv)+'<span style="font-size:14px;font-weight:400"> days</span>':'—')+'</div>'
    +'<div class="u">'+(cv!=null?(cv/30).toFixed(1)+' months on '+int(inv.available)+' available':'needs a usage figure')+'</div></div>';
  if(cv!=null&&inv.onOrder>0){
    const per=usageRate(lb).perMonth/30;
    const withIn=per>0?inv.position/per:null;
    h+='<div class="tile" style="border:0;padding:10px 0 0"><div class="l">Including confirmed incoming</div>'
      +'<div class="v">'+(withIn!=null?(withIn/30).toFixed(1)+'<span style="font-size:14px;font-weight:400"> months</span>':'—')+'</div>'
      +'<div class="u">on a position of '+int(inv.position)+'</div></div>';
  }
  h+='<div style="border-top:1px solid var(--rule2);margin-top:12px;padding-top:10px">'
    +'<div class="l" style="font-size:11px;color:var(--key3)">Usage rate</div>'
    +'<div style="font-size:16px;font-weight:600">'+(ur.perMonth?int(ur.perMonth)+' a month':'not set')+'</div>'
    +'<div class="mini">Source: '+(ur.source==='manual'?'manual forecast override'
      :ur.source==='derived'?'transaction history, '+ur.months+' months':'no data yet')+'</div></div>';
  if(cv!=null&&ld!=null){
    const span=Math.max(cv,ld)*1.35, g=st==='out'?'out':(st==='low'||cv<ld)?'low':'';
    h+='<div class="gauge '+g+'" style="margin-top:14px"><i style="width:'+Math.max(0,Math.min(100,cv/span*100))+'%"></i>'
      +'<b style="left:'+Math.min(100,ld/span*100)+'%"></b></div>'
      +'<p class="hint" style="margin-top:22px">The bar is how long available stock lasts. The mark is the '+ld
      +' days a replenishment takes.</p>';
  }
  h+='</div></div>';
  if(Object.keys(inv.byArt).length>1||conflicts.length){
    h+='<div class="panel"><hgroup><h2>Stock by artwork</h2></hgroup><div class="in">'
      +Object.keys(inv.byArt).map(k=>{const art=artwork(k), curr=k===lb.currentArtworkId;
        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--rule2)">'
          +'<span>'+(art?esc(art.version):'Not recorded')+(curr?' <span class="mini" style="color:var(--gain)">current</span>':'')+'</span>'
          +'<b class="'+(curr?'':'flagtxt')+'">'+int(inv.byArt[k])+'</b></div>';}).join('')
      +'</div></div>';
  }
  return h+'</div></div>';
}

/* ---------- evidence thumbnails ---------- */
function shotsHTML(entity,entityId,labelId,skipId){
  const list=evidenceFor(entity,entityId).filter(e=>e.id!==skipId);

  return list.map(e=>{
    const isImg=(e.mime||'').startsWith('image/');
    return '<figure class="shot" style="margin:0">'
      +(isImg?'<img data-img="'+e.imgId+'" onclick="lightbox(\''+e.imgId+'\')" alt="'+esc(e.caption||e.name||'Evidence')+'">'
             :'<div class="doc" data-img="'+e.imgId+'" onclick="openDoc(this)">'+ic('page',15)+'<span style="margin-left:6px">'+esc(e.name||'file')+'</span></div>')
      +'<input class="ed cap" style="font-size:11.5px" value="'+esc(e.caption||'')+'" data-p="evidence|'+e.id+'|caption" placeholder="Caption" aria-label="Caption">'
      +'<button class="rm noprint" onclick="rmEvidence(\''+e.id+'\')" aria-label="Remove">'+ic('x',12)+'</button></figure>';
  }).join('');
}

   +(state.migratedFrom==='v2'?'<p class="hint">Carried over from the previous structure on '+fmtDate(state.migratedAt)
     +'. The original is still stored untouched under <b>'+BACKUPKEY+'</b>.</p>':'');
}

function poRowStatus(po){
  const f=poFinancials(po);
  if(po.procurement==='Cancelled')return {t:'Cancelled',tone:'idle'};
  const iss=state.issues.filter(i=>i.entityId===po.id&&i.status==='Open'&&i.severity==='bad');
  if(iss.length)return {t:iss[0].category+' problem',tone:'bad'};
  if(f.outstanding>0.005)return {t:fmtCur(f.outstanding,f.currency)+' outstanding',tone:'wait'};
  return {t:'Settled',tone:'ok'};
}
function renderPORail(){

  $('railTitle').textContent='Purchase orders';
  const list=state.pos.filter(p=>{
    if(!term)return true;

      +'<span class="stamp tone-'+st.tone+'" style="border-width:1px;border-style:solid">'+esc(st.t)+'</span></div></button>';

}

      +'<td>'+esc(lb.name||'—')+'</td><td class="dim">'+esc(supplierName(p.supplierId))+'</td>'
      +'<td class="n fig">'+int(p.terms.qty)+'</td>'
      +'<td>'+(a?'<span class="stamp a-'+esc(a.status)+'">'+esc(a.version)+'</span>':'<span class="dim">none</span>')
        +(drift?'<div class="mini flagtxt">older version</div>':'')+'</td>'

/* ---------- one purchase order ---------- */
function renderPO(po){
  if(!po){goto('pos');return;}
  const lb=label(po.labelId)||{}, f=poFinancials(po), a=artwork(po.artworkId);
  const issues=poIssues(po), amended=poAmended(po), drift=poArtworkDrift(po), late=poDelayDays(po);
  let h='<div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px">'
    +'<button class="tbtn noprint" onclick="goto(\'pos\')">'+ic('back',13)+'All orders</button>'
    +'<div style="flex:1;min-width:240px"><div class="mini">'+esc(lb.name||'')+'</div>'
    +'<h2 style="font-size:24px;letter-spacing:-.025em">'+esc(po.id)+'</h2></div>'
    +'<div class="rowbtns noprint">'
    +poPrimaryAction(po)
    +'<button class="tbtn" onclick="window.print()">'+ic('print',13)+'Print</button></div></div>';

  h+='<div class="strip">'
    +'<div><div class="l">Supplier</div><div class="v" style="font-size:15px;padding-top:3px">'+esc(supplierName(po.supplierId))
      +(supplier(po.supplierId)&&!supplier(po.supplierId).active?' <span class="mini">(inactive)</span>':'')+'</div></div>'
    +'<div><div class="l">Quantity</div><div class="v">'+int(po.terms.qty)+'</div></div>'
    +'<div><div class="l">Artwork</div><div class="v" style="font-size:15px;padding-top:4px">'
      +(a?'<span class="stamp a-'+esc(a.status)+'">'+esc(a.version)+' '+esc(a.status)+'</span>':'<span class="dim">none</span>')+'</div></div>'
    +'<div class="sep"><div class="l">Committed</div><div class="v">'+fmtCur(f.committed,f.currency)+'</div></div>'
    +'<div class="sep"><div class="l">Paid</div><div class="v good">'+fmtCur(f.paid+f.credits,f.currency)+'</div></div>'
    +'<div class="sep"><div class="l">Outstanding</div><div class="v '+(f.outstanding>0.005?'warn':'good')+'">'+fmtCur(f.outstanding,f.currency)+'</div></div>'
    +'<div class="sep"><div class="l">Landed each</div><div class="v">'+fmtCur(f.landedEach,f.currency,4)+'</div></div>'
    +'</div>';

  const shipState=poShippingState(po);
  h+='<div class="sstrip">'+PO_DIM.map(d=>{
    if(d[0]==='shipping'&&shipState.derived){
      return '<div><div class="l">'+d[1]+'</div>'
        +'<div class="psel tone-'+poTone(shipState.value)+'" style="cursor:default">'+esc(shipState.value)+'</div>'
        +'<div class="mini" style="margin-top:3px">from its shipment</div></div>';
    }
    const v=po[d[0]]||'';
    return '<div><div class="l">'+d[1]+'</div>'
      +'<select class="psel tone-'+poTone(v)+'" onchange="setPOStatus(\''+po.id+'\',\''+d[0]+'\',this.value)">'
      +PO_STATUS[PO_KEY[d[0]]].map(x=>'<option'+(v===x?' selected':'')+'>'+x+'</option>').join('')
      +'</select></div>';
  }).join('')+'</div>';

  if(late)h+='<div class="conflict"><h3>'+late+' day'+(late===1?'':'s')+' past the promised completion date</h3>'
    +'<p>Promised '+fmtDate(po.m.promisedComplete)+'. Production is still marked <b>'+esc(po.production)
    +'</b>. Nothing has been changed for you, set the status yourself once you know where it really stands.</p></div>';
  if(f.overpaid>0)h+='<div class="conflict"><h3>Payments exceed the commitment by '+fmtCur(f.overpaid,f.currency)+'</h3>'
    +'<p>Recorded payments come to '+fmtCur(f.paid+f.credits,f.currency)+' against '+fmtCur(f.committed,f.currency)
    +' committed. That could be an advance, a freight difference, an adjustment, or a mistake. '
    +'Record it as whichever it is rather than leaving the order looking settled.</p></div>';
  if(drift)h+='<div class="warnrow">This order was placed on artwork <b>'+esc(drift.po?drift.po.version:'?')
    +'</b>. The label\'s current artwork is now <b>'+esc(drift.current?drift.current.version:'newer')
    +'</b>. The order stays bound to what was actually ordered.</div>';
  if(amended.length&&po.procurement!=='Draft')h+='<div class="warnrow">Amended after confirmation: '
    +amended.map(x=>esc(x.field)+' '+esc(String(x.from))+' to '+esc(String(x.to))).join(', ')
    +'. The original terms are kept in the history.</div>';

  const TB=(k,l,n)=>'<button class="'+(route.tab===k?'on':'')+'" onclick="tabTo(\''+k+'\')">'+l
    +(n?'<span class="count">'+n+'</span>':'')+'</button>';
  h+='<div class="tabs noprint">'+TB('overview','Overview',issues.length)
    +TB('payments','Payments',paymentsFor(po.id).filter(x=>!x.voided).length)
    +TB('evidence','Evidence',evidenceFor('po',po.id).length)+TB('history','History','')+'</div>';

  switch(route.tab){
    case 'payments': h+=poPayments(po,f); break;
    case 'evidence': h+=poEvidence(po); break;
    case 'history':  h+=poHistory(po); break;
    default:         h+=poOverview(po,f,issues); break;
  }
  $('view').innerHTML=h;
  const d=$('drop_po'); if(d)wireDrop(d,files=>addFiles('po|'+po.id+'|'+po.labelId,files));
}

function poPayments(po,f){
  const scs=schedulesFor(po.id), pays=paymentsFor(po.id);
  let h='<div class="strip">'
    +'<div><div class="l">Committed</div><div class="v">'+fmtCur(f.committed,f.currency)+'</div></div>'
    +'<div><div class="l">Paid</div><div class="v good">'+fmtCur(f.paid,f.currency)+'</div></div>'
    +(f.credits?'<div><div class="l">Credits</div><div class="v good">'+fmtCur(f.credits,f.currency)+'</div></div>':'')
    +(f.refunds?'<div><div class="l">Refunded to you</div><div class="v">'+fmtCur(f.refunds,f.currency)+'</div></div>':'')
    +'<div class="sep"><div class="l">Outstanding</div><div class="v '+(f.outstanding>0.005?'warn':'good')+'">'+fmtCur(f.outstanding,f.currency)+'</div></div>'
    +(f.overpaid?'<div class="sep"><div class="l">Overpaid</div><div class="v bad">'+fmtCur(f.overpaid,f.currency)+'</div></div>':'')
    +'</div>'
    +'<p class="hint" style="margin:-8px 0 16px">Outstanding is the commitment less payments made and credits granted. '
    +'Refunds count against payments. Freight stays inside the commitment because it has not been paid yet.</p>';

  h+='<div class="panel"><hgroup><h2>Schedule</h2><p>What is planned, and when it falls due</p><div class="grow"></div>'
    +'<div class="rowbtns noprint">'
    +(scs.length?'':'<button class="tbtn" onclick="suggestSchedule(\''+po.id+'\')">Draft a schedule</button>')
    +'<button class="tbtn" onclick="addScheduleRow(\''+po.id+'\')">'+ic('plus',13)+'Add a line</button></div></hgroup><div class="in flush">';
  if(!scs.length)h+='<div class="blank"><b>No schedule yet</b>Add the payments the supplier expects, with the amounts and dates they asked for.</div>';
  else{
    h+='<div class="scroll"><table><thead><tr><th>Type</th><th>Description</th><th>Due</th>'
      +'<th class="n">Expected</th><th class="n">Paid so far</th><th>Status</th><th class="noprint"></th></tr></thead><tbody>';
    scs.forEach(sc=>{
      const S='schedules|'+sc.id+'|', st=scheduleStatus(sc), got=paidAgainst(sc.id);
      const tone=st==='Paid'?'ok':st==='Overdue'?'bad':st==='Due'?'wait':'idle';
      h+='<tr><td><select class="ed" data-p="'+S+'type">'
          +PAY_TYPES.map(t=>'<option'+(sc.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select></td>'
        +'<td><input class="ed" value="'+esc(sc.description)+'" data-p="'+S+'description" placeholder="what it covers"></td>'
        +'<td><input class="ed" type="date" value="'+esc(sc.dueDate)+'" data-p="'+S+'dueDate"></td>'
        +'<td><input class="ed n" type="number" step="0.01" value="'+esc(sc.expectedAmount)+'" data-p="'+S+'expectedAmount"></td>'
        +'<td class="n '+(got?'fig':'dim')+'">'+fmtCur(got,f.currency)+'</td>'
        +'<td><span class="stamp tone-'+tone+'" style="border-width:1px;border-style:solid">'+st+'</span></td>'
        +'<td class="noprint"><div class="rowbtns">'
          +(st==='Paid'||sc.waived?'':'<button class="tbtn" onclick="recordPayment(\''+po.id+'\',\''+sc.id+'\')">Record</button>')
          +'<button class="icx" onclick="delSchedule(\''+sc.id+'\')" aria-label="Remove">'+ic('x',13)+'</button></div></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div></div>';

  h+='<div class="panel"><hgroup><h2>Payments made</h2><p>Each one stays in the record, voided rather than deleted</p>'
    +'<div class="grow"></div><button class="tbtn key noprint" onclick="recordPayment(\''+po.id+'\',null)">'
    +ic('plus',13)+'Record a payment</button></hgroup><div class="in flush">';
  if(!pays.length)h+='<div class="blank"><b>Nothing paid yet</b>Record a payment when the money actually leaves.</div>';
  else{
    h+='<div class="scroll"><table><thead><tr><th>Payment</th><th>Date</th><th>Type</th><th>Against</th>'
      +'<th class="n">Amount</th><th>Method</th><th>Reference</th><th class="noprint"></th></tr></thead><tbody>';
    pays.slice().reverse().forEach(p=>{
      const Y='payments|'+p.id+'|', sc=p.scheduleId?byId('schedules',p.scheduleId):null;
      h+='<tr'+(p.voided?' class="void"':'')+'><td class="mini">'+esc(p.id)+(p.voided?'<div class="flagtxt">void</div>':'')+'</td>'
        +'<td><input class="ed" type="date" value="'+esc(p.datePaid)+'" data-p="'+Y+'datePaid"></td>'
        +'<td><select class="ed" data-p="'+Y+'type">'+PAY_TYPES.map(t=>'<option'+(p.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select></td>'
        +'<td class="dim mini">'+(sc?esc(sc.type)+' '+esc(sc.id):'unmatched')+'</td>'
        +'<td><input class="ed n" type="number" step="0.01" value="'+esc(p.amount)+'" data-p="'+Y+'amount"></td>'
        +'<td><input class="ed" value="'+esc(p.method)+'" data-p="'+Y+'method" placeholder="bank transfer"></td>'
        +'<td><input class="ed" value="'+esc(p.reference)+'" data-p="'+Y+'reference" placeholder="reference"></td>'
        +'<td class="noprint">'+(p.voided?'':'<button class="tbtn" onclick="voidPayment(\''+p.id+'\')">Void</button>')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  return h+'</div></div>';
}

function poHistory(po){
  const acts=state.activity.filter(a=>a.entityId===po.id).slice().reverse();
  let h='<div class="panel"><hgroup><h2>History</h2><p>Newest first</p></hgroup><div class="in">';
  if(!acts.length)h+='<div class="emptyline">Nothing recorded yet.</div>';

let shipForm={shipmentId:'',qty:''};

function newShipment(opts){
  opts=opts||{};
  const sh={id:nextId('shipment'),status:'Draft',carrier:'',forwarder:'',method:'Express',
    originCountry:'China',originCity:'',destination:'Miami, USA',tracking:'',trackingUrl:'',
    bookedDate:'',shipDate:'',eta:'',actualArrival:'',
    freight:'',brokerage:'',duties:'',insurance:'',otherCost:'',currency:'USD',
    allocationMethod:'quantity',allocationFinalized:false,
    notes:'',createdDate:today(),modifiedDate:today()};
  state.shipments.push(sh);
  logActivity('shipment',sh.id,null,'Shipment created');
  save(true);
  if(!opts.quiet)goto('shipment',sh.id,'overview');
  return sh;
}
function addPOToShipment(shipmentId,poId,qty){
  const sh=byId('shipments',shipmentId), po=byId('pos',poId);
  if(!sh||!po)return null;
  const e=shipEligibility(po,qty);
  if(e.block.length){alert(e.block.join('\n'));return null;}
  const q=num(qty)||e.max;
  if(q<=0){toast('Nothing left of that order to ship');return null;}
  if(e.warn.length&&!confirm(e.warn.join('\n')+'\n\nAdd it to '+sh.id+' anyway?'))return null;
  const line={id:nextId('shipline'),shipmentId:sh.id,poId:po.id,labelId:po.labelId,
    artworkId:po.artworkId,qty:q,weight:'',cartons:'',allocatedFreight:'',notes:''};
  state.shipmentLines.push(line);
  sh.modifiedDate=today();
  logActivity('shipment',sh.id,po.labelId,po.id+' added to '+sh.id+', '+int(q)+' labels');
  logActivity('po',po.id,po.labelId,int(q)+' labels assigned to shipment '+sh.id);
  save(true); return line;
}
function removeShipLine(lineId){
  const l=byId('shipmentLines',lineId); if(!l)return;
  const sh=shipmentOf(l);
  const gone=sh&&SHIP_OPEN.indexOf(sh.status)<0;
  if(gone&&!confirm('This shipment has already left. Removing '+l.poId+' from it changes a logistics record that has happened.\n\nRemove it anyway? The change is written to the history.'))return;
  if(!gone&&!confirm('Remove '+l.poId+' from '+sh.id+'?'))return;
  state.shipmentLines=state.shipmentLines.filter(x=>x.id!==lineId);
  logActivity('shipment',sh.id,l.labelId,l.poId+' removed from '+sh.id+', '+int(num(l.qty))+' labels'
    +(gone?' (after the shipment had already left)':''));
  save(true);render();
}
function setShipStatus(shipmentId,value){
  const sh=byId('shipments',shipmentId); if(!sh)return;
  const was=sh.status; if(was===value)return;
  if(value==='Cancelled'&&!confirm('Cancel '+sh.id+'? Its orders go back to awaiting shipment and its costs stop counting.'))return;
  sh.status=value; sh.modifiedDate=today();
  if(value==='Shipped'&&!sh.shipDate)sh.shipDate=today();
  if(value==='Booked'&&!sh.bookedDate)sh.bookedDate=today();
  if(value==='Delivered'&&!sh.actualArrival)sh.actualArrival=today();
  logActivity('shipment',sh.id,null,'Status moved from '+was+' to '+value);
  if(value==='Delivered')
    logActivity('shipment',sh.id,null,'Delivered. Nothing has been added to stock: the quantity is awaiting receipt until Receiving posts what actually arrived.');
  save(true);render();
}
function applyAllocation(shipmentId){
  const sh=byId('shipments',shipmentId); if(!sh)return;
  if(sh.allocationFinalized&&!confirm('This allocation was finalised. Recalculating rewrites agreed logistics costs.\n\nGo ahead? The change is written to the history.'))return;
  const p=proposeAllocation(sh);
  if(!p.ok){alert(p.why);return;}
  if(p.manual){toast('Manual allocation: type the amounts on each line');return;}
  p.rows.forEach(r=>{const l=byId('shipmentLines',r.lineId); if(l)l.allocatedFreight=r.amount;});
  const c=shipCosts(sh);
  logActivity('shipment',sh.id,null,'Freight allocated '+(sh.allocationMethod==='weight'?'by weight':'by quantity')
    +', '+fmtCur(c.total,c.currency)+' across '+p.rows.length+' line'+(p.rows.length===1?'':'s')
    +(sh.allocationFinalized?' (recalculated after being finalised)':''));
  save(true);render();
}
function finalizeAllocation(shipmentId){
  const sh=byId('shipments',shipmentId); if(!sh)return;
  const a=allocationState(sh);
  if(!a.clean&&!confirm((a.over?'Allocations exceed the cost by '+fmtCur(-a.diff,a.currency)
      :fmtCur(a.diff,a.currency)+' is still unallocated')+'.\n\nFinalise anyway?'))return;
  sh.allocationFinalized=!sh.allocationFinalized;
  logActivity('shipment',sh.id,null,sh.allocationFinalized?'Freight allocation finalised':'Freight allocation reopened');
  save(true);render();
}
function delShipment(shipmentId){
  const sh=byId('shipments',shipmentId); if(!sh)return;
  if(linesOfShipment(sh.id).length){alert('Take the orders out of this shipment first, or cancel it instead so the record survives.');return;}
  if(!confirm('Delete the empty shipment '+sh.id+'?'))return;
  state.shipments=state.shipments.filter(x=>x.id!==sh.id);
  save(true);goto('shipments');
}

function startReceipt(shipmentId){
  const r=newReceipt(shipmentId);

  if(!linesOfReceipt(r.id).length){
    state.receipts=state.receipts.filter(x=>x.id!==r.id);

  }

}

/* ===================================================================
   EDITING  ·  every path is id based, never an array index
   =================================================================== */
const EDITABLE={labels:1,suppliers:1,artworks:1,quotes:1,requests:1,freight:1,movements:1,
                tasks:1,evidence:1,pos:1,schedules:1,payments:1,shipments:1,shipmentLines:1,
                receipts:1,receiptLines:1};
function resolve(path){
  const p=path.split('|');
  if(p[0]==='line'){
    const q=byId('quotes',p[1]); if(!q)return null;
    const l=(q.lines||[]).find(x=>x.id===p[2]);
    return l?[l,p[3]]:null;
  }
  if(p[0]==='poterms'){const po=byId('pos',p[1]);return po?[po.terms,p[2]]:null;}
  if(p[0]==='pom'){const po=byId('pos',p[1]);return po?[po.m,p[2]]:null;}
  if(!EDITABLE[p[0]])return null;
  const rec=byId(p[0],p[1]);
  return rec?[rec,p[2]]:null;
}
document.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.p)return;
  const r=resolve(el.dataset.p); if(!r)return;
  r[0][r[1]]=el.value;
  if(el.dataset.p.startsWith('labels|'))r[0].modified=today();
  save();
  if(el.tagName==='TEXTAREA')autogrow(el);
  if(el.dataset.p.indexOf('poterms|')===0)recalcPO(el.dataset.p.split('|')[1]);
  if(el.dataset.p.indexOf('payments|')===0||el.dataset.p.indexOf('schedules|')===0){
    const rec=resolve(el.dataset.p);
    const po=rec?byId('pos',rec[0].poId):null; if(po)refreshPaymentStatus(po);
  }
  if(/\|(qty|price|ship|exw|plate|sample|plateFee|sampleFee|productionDays|currency|moq|flat|perK|carrier|days|usage|reorderAt|safetyDays|unitPrice|otherCharges|freight|amount|expectedAmount|dueDate)$/.test(el.dataset.p))
    queueRefresh();
});
document.addEventListener('change',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.p)return;
  const path=el.dataset.p;
  if(path.indexOf('artworks|')===0&&/\|status$/.test(path)){
    const a=byId('artworks',path.split('|')[1]);
    if(a&&a.status==='Approved'&&!a.approvedAt)a.approvedAt=today();
    if(a)logActivity('artwork',a.id,a.labelId,'Artwork '+a.version+' set to '+a.status);
  }
  if(path.indexOf('poterms|')===0){
    const po=byId('pos',path.split('|')[1]);
    if(po&&po.procurement!=='Draft')
      logActivity('po',po.id,po.labelId,'Amended after confirmation: '+path.split('|')[2]
        +' set to '+el.value+', commitment now '+fmtCur(poFinancials(po).committed,po.terms.currency));
  }
  if(path.indexOf('pos|')===0&&/\|artworkId$/.test(path)){
    const po=byId('pos',path.split('|')[1]);
    if(po)logActivity('po',po.id,po.labelId,'Artwork version set to '+((artwork(po.artworkId)||{}).version||'none'));
  }
  if(el.tagName==='SELECT'||/\|(name|status|type|artworkId|supplierId|preferredSupplierId|version)$/.test(path)){
    save(true); render();
  }
});
let _rf;
function queueRefresh(){clearTimeout(_rf);_rf=setTimeout(()=>{
  const a=document.activeElement, p=a&&a.dataset?a.dataset.p:null, s=a?a.selectionStart:null;
  render();
  if(p){const n=document.querySelector('[data-p="'+p+'"]');
    if(n){n.focus();try{n.setSelectionRange(s,s)}catch(e){}}}
},700);}

/* --- artwork --- */
function makeArtworkRecord(labelId,version,reason){
  const a={id:nextId('artwork'),labelId:labelId,version:version,status:'Draft',evidenceId:null,
    reason:reason||'',notes:'',createdAt:today(),submittedAt:'',approvedAt:'',approvedBy:'',
    supplierId:(label(labelId)||{}).preferredSupplierId||null,
    supplierConfirmed:false,supplierConfirmedAt:'',proofReceived:false,proofReceivedAt:'',
    proofApproved:false,proofApprovedAt:'',conflictAck:false};
  state.artworks.push(a); return a;
}
function addArtwork(labelId){
  const existing=artworksFor(labelId);
  const n=existing.reduce((m,a)=>Math.max(m,parseInt(String(a.version).replace(/\D/g,''),10)||0),0)+1;
  const a=makeArtworkRecord(labelId,'v'+n,'');
  logActivity('artwork',a.id,labelId,'Artwork '+a.version+' created');
  save(true); render();
}
function delArtwork(id){
  const a=artwork(id); if(!a)return;
  const lb=label(a.labelId);
  if(lb&&lb.currentArtworkId===id){alert('This is the current version. Make another version current first.');return;}
  const stock=inventory(a.labelId).byArt[id]||0;
  if(stock>0){alert(int(stock)+' labels in stock were printed from this version. It cannot be deleted while that stock exists.');return;}
  if(!confirm('Delete artwork '+a.version+'? Its files are removed too.'))return;
  evidenceFor('artwork',id).forEach(e=>{dropImg(e.imgId);state.evidence=state.evidence.filter(x=>x.id!==e.id)});
  state.artworks=state.artworks.filter(x=>x.id!==id);
  save(true); render();
}
/* Making a version current never edits any record that already points at the old
   one. The previous approved version is marked superseded and kept. */
function makeCurrent(labelId,artId){
  const lb=label(labelId), a=artwork(artId); if(!lb||!a)return;
  const prev=artwork(lb.currentArtworkId);
  if(prev&&prev.id!==artId&&prev.status==='Approved'){prev.status='Superseded';
    logActivity('artwork',prev.id,labelId,'Artwork '+prev.version+' superseded by '+a.version);}
  lb.currentArtworkId=artId; lb.modified=today();
  logActivity('artwork',artId,labelId,'Artwork '+a.version+' made current');
  save(true); render();
  const c=artworkConflicts(labelId);
  if(c.length)toast(int(c.reduce((x,y)=>x+y.qty,0))+' labels in stock still use an older version');
}
function setFlag(artId,field,v){
  const a=artwork(artId); if(!a)return;
  a[field]=v;
  const stamp={supplierConfirmed:'supplierConfirmedAt',proofReceived:'proofReceivedAt',proofApproved:'proofApprovedAt'}[field];
  if(stamp)a[stamp]=v?today():'';
  logActivity('artwork',artId,a.labelId,'Artwork '+a.version+': '+field.replace(/([A-Z])/g,' $1').toLowerCase()+(v?' yes':' no'));
  save(true); render();
}
/* Every route out of an artwork conflict is a deliberate decision on one lot.
   Use remaining records a disposition, it never pretends the old version
   became current again. */
function resolveConflict(labelId,lotId,action){
  const lot=byId('lots',lotId); if(!lot)return;
  const a=artwork(lot.artworkId), bal=lotBalance(lotId), qty=bal.available;
  if(qty<=0)return;
  const v=a?a.version:'an older version';
  if(action==='use'){
    lot.disposition='Use remaining';
    logActivity('lot',lotId,labelId,'Approved to consume the remaining '+int(qty)+' labels on '+v
      +'. The lot stays on '+v+', it is not reassigned to the current version.');
    save(true);render();return;
  }
  if(action==='quarantine')postMovement(labelId,'Quarantine',qty,{lotId:lotId,
    reason:'Artwork '+v+' is no longer current',note:'From the artwork conflict'});
  if(action==='obsolete'){
    postMovement(labelId,'Mark obsolete',qty,{lotId:lotId,
      reason:'Artwork '+v+' superseded',note:'From the artwork conflict'});
    lot.disposition='Marked obsolete';
  }
  if(action==='destroy'){
    if(!confirm('Destroy '+int(qty)+' labels printed from '+v+'? They come off the shelf permanently and the lot keeps its history.'))return;
    postMovement(labelId,'Destroy',qty,{lotId:lotId,from:'available',
      reason:'Artwork '+v+' written off',note:'From the artwork conflict'});
    lot.disposition='Destroyed';
  }
  save(true); render();
}

/* ---------- purchase order actions ---------- */
function orderOption(quoteId,lineId){
  const po=createPOFromLine(quoteId,lineId);
  if(po){toast('Created '+po.id);goto('po',po.id,'overview');}
}
/* qty and unit price drive the printing subtotal, everything else adds on top */
function recalcPO(poId){
  const po=byId('pos',poId); if(!po)return;
  const t=po.terms, r2=v=>Math.round(v*1e6)/1e6;
  t.printSubtotal=r2(num(t.qty)*num(t.unitPrice));
  t.total=r2(num(t.printSubtotal)+num(t.plateFee)+num(t.sampleFee)+num(t.otherCharges)+num(t.freight));
  t.landedEach=num(t.qty)>0?r2(t.total/num(t.qty)):0;
  refreshPaymentStatus(po);
}
function poPrimaryAction(po){
  if(po.procurement==='Draft')
    return '<button class="tbtn key" onclick="advancePO(\''+po.id+'\',\'sent\')">Send to supplier</button>';
  if(po.procurement==='Awaiting Supplier Confirmation')
    return '<button class="tbtn key" onclick="advancePO(\''+po.id+'\',\'confirm\')">'+ic('check',13)+'Supplier confirmed</button>';
  return '';
}
function advancePO(poId,step){
  const po=byId('pos',poId); if(!po)return;
  if(step==='sent'){
    if(!po.artworkId){alert('Attach an artwork version before sending this to the supplier. An order has to say exactly which version to print.');return;}
    po.procurement='Awaiting Supplier Confirmation';
    if(!po.m.sent)po.m.sent=today();
    if(po.artworkStatus==='Not Sent')po.artworkStatus='Sent';
    logActivity('po',po.id,po.labelId,'Sent to '+supplierName(po.supplierId)+' for confirmation');
  }
  if(step==='confirm'){
    if(!po.artworkId){alert('A confirmed order must be bound to one artwork version.');return;}
    po.procurement='Confirmed';
    if(!po.m.supplierConfirmed)po.m.supplierConfirmed=today();
    logActivity('po',po.id,po.labelId,'Supplier confirmed the order. Artwork '
      +((artwork(po.artworkId)||{}).version||'?')+' is locked to this order and the commercial terms are fixed');
  }
  save(true);render();
}
function setPOStatus(poId,dim,value){
  const po=byId('pos',poId); if(!po)return;
  const was=po[dim];
  if(was===value)return;
  if(dim==='procurement'&&(value==='Confirmed'||value==='Active')&&!po.artworkId){
    alert('A confirmed order must be bound to one artwork version. Set it first.');render();return;
  }
  po[dim]=value;
  const label_=PO_DIM.filter(d=>d[0]===dim)[0][1];
  logActivity('po',po.id,po.labelId,label_+' moved from '+was+' to '+value);
  /* dates follow the status, but only when they are still blank */
  if(dim==='procurement'&&value==='Confirmed'&&!po.m.supplierConfirmed)po.m.supplierConfirmed=today();
  if(dim==='artworkStatus'&&value==='Approved'&&!po.m.artworkApproved)po.m.artworkApproved=today();
  if(dim==='production'&&value==='In Production'&&!po.m.productionStart)po.m.productionStart=today();
  if(dim==='production'&&value==='Complete'&&!po.m.actualComplete)po.m.actualComplete=today();
  save(true);render();
}
function cancelPO(poId){
  const po=byId('pos',poId); if(!po)return;
  const f=poFinancials(po);
  let msg='Cancel '+po.id+'? It stays in the record with its payments.';
  if(f.paid>0)msg+='\n\n'+fmtCur(f.paid,f.currency)+' has already been paid against it. Sort out a refund or credit with the supplier separately.';
  if(!confirm(msg))return;
  po.procurement='Cancelled';
  logActivity('po',po.id,po.labelId,'Order cancelled'+(f.paid>0?' with '+fmtCur(f.paid,f.currency)+' already paid':''));
  save(true);render();
}
function addScheduleRow(poId){addSchedule(poId,'Deposit','','','');render();}
function delSchedule(id){
  const sc=byId('schedules',id); if(!sc)return;
  const linked=state.payments.filter(p=>p.scheduleId===id&&!p.voided).length;
  if(linked){alert(linked+' payment'+(linked===1?' is':'s are')+' matched to this line. Void the payment first, so the money stays traceable.');return;}
  state.schedules=state.schedules.filter(x=>x.id!==id);
  save(true);render();
}

/* ===================================================================
   FILES AND EVIDENCE
   =================================================================== */
const EV_TYPE={artwork:'Artwork',quote:'Quote message',label:'Document',po:'Order document',
               shipment:'Shipping document',receipt:'Receiving photo'};
function storeFiles(files){
  return Promise.all([...files].map(f=>{
    const imgId=rid('im');
    return putImg(imgId,f).then(()=>({imgId,name:f.name,mime:f.type}));
  }));
}
function addFiles(owner,files){
  const p=owner.split('|'), entity=p[0], entityId=p[1], labelId=p[2];
  storeFiles(files).then(stored=>{
    stored.forEach(s=>{
      const ev={id:nextId('evidence'),imgId:s.imgId,name:s.name,mime:s.mime,caption:'',
        entity:entity,entityId:entityId,labelId:labelId,date:today(),type:EV_TYPE[entity]||'Document'};
      state.evidence.push(ev);
      if(entity==='artwork'){
        const a=artwork(entityId);
        if(a&&!a.evidenceId&&(s.mime||'').startsWith('image/'))a.evidenceId=ev.id;
      }
    });
    logActivity(entity,entityId,labelId,stored.length+' file'+(stored.length===1?'':'s')+' attached');
    save(true); render(); toast(stored.length+' file'+(stored.length===1?'':'s')+' added');
  });
}
function rmEvidence(id){
  const e=byId('evidence',id); if(!e)return;
  state.artworks.forEach(a=>{if(a.evidenceId===id)a.evidenceId=null});
  state.evidence=state.evidence.filter(x=>x.id!==id);
  dropImg(e.imgId); save(true); render();
}
function wireDrop(el,cb){
  if(!el)return;
  ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();el.classList.add('over')}));
  ['dragleave','dragend'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.remove('over')}));
  el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('over');
    const f=[...e.dataTransfer.files].filter(x=>x.type.startsWith('image/')||x.type==='application/pdf');
    if(f.length)cb(f); else toast('Only images and PDFs');});
}
function wireAllDrops(lb){
  const d=$('drop_label'); if(d)wireDrop(d,f=>addFiles('label|'+lb.id+'|'+lb.id,f));
  quotesFor(lb.id).forEach(q=>{const el=$('drop_'+q.id); if(el)wireDrop(el,f=>addFiles('quote|'+q.id+'|'+lb.id,f));});
  artworksFor(lb.id).forEach(a=>{const el=$('drop_'+a.id); if(el)wireDrop(el,f=>addFiles('artwork|'+a.id+'|'+lb.id,f));});
}
let _pick=null;
function pickFiles(owner){_pick=owner;$('filePick').click();}
$('filePick').onchange=function(){
  const f=[...this.files]; this.value=''; if(!f.length)return;
  _pick?addFiles(_pick,f):newLabelFrom(f);
};
document.addEventListener('paste',e=>{
  if(/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName))return;
  const f=[...(e.clipboardData||{}).items||[]].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);
  if(!f.length)return;
  e.preventDefault();
  if(route.view==='label'&&route.id){
    const lb=label(route.id);
    addFiles(route.tab==='artwork'&&lb.currentArtworkId?('artwork|'+lb.currentArtworkId+'|'+lb.id):('label|'+lb.id+'|'+lb.id),f);
  } else newLabelFrom(f);
});
window.addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('dragging')});
window.addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dragging')});

/* ===================================================================
   SHARING, BACKUP, BOOT
   =================================================================== */
function copySummary(){
  const lb=label(route.id); if(!lb)return;
  const o=optionsFor(lb.id), b=o[0], inv=inventory(lb.id), art=artwork(lb.currentArtworkId), L=[];
  L.push(lb.name||'Label');
  const spec=[lb.size,lb.material,lb.finish].filter(Boolean).join(', ');
  if(spec)L.push(spec);
  if(art)L.push('Artwork '+art.version+', '+art.status.toLowerCase());
  L.push('');
  if(!o.length)L.push('No prices yet.');
  else{
    L.push('Options, all costs included:');
    o.slice().sort((a,c)=>a.qty-c.qty).forEach(r=>L.push('  '+int(r.qty)+' labels - '+money(r.total)
      +' total - '+each(r.per)+' each ('+supplierName(r.q.supplierId)+')'));
    L.push('');
    L.push('Best value: '+int(b.qty)+' at '+each(b.per)+' each, '+money(b.total)+' all in.');
    const parts=[];
    if(b.goods)parts.push('labels '+money(b.goods));
    if(b.fixed)parts.push('plates '+money(b.fixed));
    if(b.ship)parts.push('shipping '+money(b.ship)+(b.shipName?' via '+b.shipName:''));
    L.push('That breaks down as '+parts.join(', ')+'.');
  }
  if(inv.tracked){L.push('');L.push('Stock: '+int(inv.available)+' available of '+int(inv.onHand)+' on hand.');}
  const open=issuesFor(lb.id).filter(i=>i.severity==='bad'||i.severity==='warn');
  if(open.length){L.push('');L.push('Still to sort out:');open.forEach(i=>L.push('  - '+i.text.replace(/<[^>]+>/g,'')));}
  navigator.clipboard.writeText(L.join('\n')).then(()=>toast('Summary copied'),()=>toast('Could not copy'));
}
function dl(name,text,type){const b=new Blob([text],{type:type||'application/json'}),u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),4000);}
function allImgIds(){return state.evidence.map(e=>e.imgId).filter(Boolean)}
function grabImg(id){
  const d=baked(id); if(d)return Promise.resolve([id,d]);
  return getImg(id).then(b=>b?blobToData(b).then(x=>[id,x]):null).catch(()=>null);
}

/* ===================================================================
   PUBLISHING

   The published page is not a printout, it is this same application
   carrying the data inside it. Open the link on another computer and
   you get the work as it stood when Publish was last pressed. Put a
   token in that browser too and it can publish back.

   The token is deliberately kept OUT of `state`. Everything in state is
   serialised into the published page and into backup exports, so a token
   living there would be handed to anyone who opened the public link.
   =================================================================== */
const GHKEY='labelOS.github';
function loadGH(){
  try{const r=localStorage.getItem(GHKEY);
    if(r)return Object.assign({repo:'',path:'',branch:'main',token:''},JSON.parse(r));}catch(e){}
  return {repo:'auravitamins/aura-document-center-public',path:'label-os/index.html',branch:'main',token:''};
}
function saveGH(g){try{localStorage.setItem(GHKEY,JSON.stringify(g))}catch(e){toast('Could not save that')}}
function ghSet(field,value){
  const g=loadGH();
  if(field==='token'&&value==='')return;          /* blank means keep what is there */
  g[field]=String(value).trim(); saveGH(g);
  if(field==='token')toast('Token saved in this browser only');
  render();
}
function ghForget(){
  if(!confirm('Forget the GitHub token stored in this browser?'))return;
  const g=loadGH(); g.token=''; saveGH(g); render();
}
function b64utf8(str){
  const bytes=new TextEncoder().encode(str);
  let bin=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(bin);
}
function ghURL(g){
  const parts=String(g.repo||'').split('/');
  if(parts.length!==2||!parts[0]||!parts[1])return null;
  return 'https://'+parts[0]+'.github.io/'+parts[1]+'/'+String(g.path||'').replace(/index\.html$/,'');
}
/* true when this browser holds work the published copy has not seen */
function unpublished(){
  if(!state.lastChange)return false;
  if(!state.lastPublished)return true;
  return String(state.lastChange)>String(state.lastPublished);
}
/* the exact page that gets published, with every record and image inside it */
function buildSnapshot(){
  return Promise.all(allImgIds().map(grabImg)).then(pairs=>{
    const blobs={}; pairs.filter(Boolean).forEach(x=>blobs[x[0]]=x[1]);
    const v=$('view').innerHTML, r=$('rail').innerHTML;
    $('view').innerHTML=''; $('rail').innerHTML='';   /* also clears anything typed on screen */
    let src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    $('view').innerHTML=v; $('rail').innerHTML=r;
    const out=JSON.parse(JSON.stringify(state)); delete out.snapshot;
    const safe=o=>JSON.stringify(o).replace(/<\//g,'<\\/');
    src=src.replace(/\/\*SEED_START\*\/[\s\S]*?\/\*SEED_END\*\//,'/*SEED_START*/const SEED='+safe(out)+';/*SEED_END*/');
    src=src.replace(/\/\*BLOBS_START\*\/[\s\S]*?\/\*BLOBS_END\*\//,'/*BLOBS_START*/const SEED_BLOBS='+safe(blobs)+';/*BLOBS_END*/');
    src=src.replace(/\/\*STAMP_START\*\/[\s\S]*?\/\*STAMP_END\*\//,'/*STAMP_START*/const SNAPSHOT="'+new Date().toISOString()+'";/*STAMP_END*/');
    return src;
  });
}
function publishToGitHub(){
  const g=loadGH();
  if(!g.token){
    alert('Publishing needs a GitHub token, once per computer.\n\nBackup has a Publishing section that explains how to make one. It stays in this browser.');
    goto('backup'); return;
  }
  if(!g.repo||!g.path){toast('Set the repository and path in Backup first');goto('backup');return;}
  const btn=$('pubBtn');
  const done=()=>{if(btn){btn.disabled=false;renderNav();}};
  if(btn){btn.disabled=true;btn.textContent='Publishing...';}
  const api='https://api.github.com/repos/'+g.repo+'/contents/'+g.path;
  const H={'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  toast('Building the page...');
  buildSnapshot().then(src=>{
    toast('Sending '+Math.round(src.length/1024)+' KB to GitHub...');
    return fetch(api+'?ref='+encodeURIComponent(g.branch),{headers:H})
      .then(r=>r.ok?r.json().then(j=>j.sha):null)
      .then(sha=>fetch(api,{method:'PUT',
        headers:Object.assign({'Content-Type':'application/json'},H),
        body:JSON.stringify({message:'Label OS: update from the app',
          content:b64utf8(src),branch:g.branch,sha:sha||undefined})}))
      .then(r=>r.json().then(j=>({ok:r.ok,status:r.status,body:j})));
  }).then(res=>{
    if(!res.ok){
      if(res.status===401)throw new Error('GitHub rejected the token. It may have expired or been pasted wrong.');
      if(res.status===403)throw new Error('That token cannot write to '+g.repo+'. It needs Contents set to Read and write on that repository.');
      if(res.status===404)throw new Error('GitHub cannot find '+g.repo+'. Check the name, or whether the token can see it.');
      if(res.status===409||res.status===422)throw new Error('The file changed on GitHub while this was publishing. Press Publish again.');
      throw new Error((res.body&&res.body.message)||('HTTP '+res.status));
    }
    state.lastPublished=nowISO(); save(true);
    done(); render();
    toast('Published. Give GitHub a minute, then it is on the link.');
  }).catch(e=>{
    done();
    alert('Could not publish.\n\n'+e.message
      +'\n\nNothing is lost. Your work is still saved in this browser, and Download a copy still works.');
  });
}

/* The same page, downloaded instead of published. */
function exportShare(){
  toast('Building the page...');
  buildSnapshot().then(src=>{ dl('label-os-'+today()+'.html',src,'text/html'); toast('Saved to Downloads'); });
}
function exportAll(){
  toast('Packing files...');
  Promise.all(allImgIds().map(grabImg)).then(pairs=>{
    const blobs={}; pairs.filter(Boolean).forEach(x=>blobs[x[0]]=x[1]);
    dl('label-os-backup-'+today()+'.json',JSON.stringify({v:3,state,blobs},null,1));
  });
}
$('jsonPick').onchange=function(){
  const f=this.files[0]; this.value=''; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    let incoming=null;
    if(d.state&&Array.isArray(d.state.labels)){incoming=normalise(d.state);
      if(num(incoming.v)<4)incoming=normalise(migrateV3toV4(incoming));}
    else if(d.state&&Array.isArray(d.state.cases))incoming=normalise(migrateV3toV4(normalise(migrateV2(d.state))));
    else if(Array.isArray(d.cases))incoming=normalise(migrateV3toV4(normalise(migrateV2(d))));
    if(!incoming)throw new Error('not a Label OS backup');
    if(!confirm('Replace everything here with the backup? '+incoming.labels.length+' label(s) will be loaded.'))return;
    Promise.all(Object.keys(d.blobs||{}).map(id=>putImg(id,dataToBlobSync(d.blobs[id])))).then(()=>{
      state=incoming; save(true); goto('labels'); toast('Backup restored');
    });
  }catch(e){alert('That file did not read as a backup: '+e.message)}};
  r.readAsText(f);
};
function exportCSV(){
  let out='"label","sku","supplier","quote","date","quantity","price each","shipping","shipped by",'
        +'"plates","total","real cost each","artwork","source"\n';
  state.quotes.forEach(q=>{
    const lb=label(q.labelId)||{}, art=artwork(lb.currentArtworkId);
    linesOf(q).forEach(l=>{
      const r=lineCost(q,l);
      out+='"'+[lb.name,lb.sku,supplierName(q.supplierId),q.id,q.date,r.qty,r.unit.toFixed(5),
        r.ship.toFixed(2),r.shipName,r.fixed.toFixed(2),r.total.toFixed(2),r.per.toFixed(5),
        art?art.version:'',q.source]
        .map(v=>String(v==null?'':v).replace(/"/g,'""')).join('","')+'"\n';
    });
  });
  dl('label-prices-'+today()+'.csv',out,'text/csv');
}
function wipe(){
  if(!confirm('Erase every label, supplier, artwork version and file? Export first if you want a copy.'))return;
  if(!confirm('Last chance. This really deletes everything.'))return;
  localStorage.removeItem(KEY); indexedDB.deleteDatabase('labelQuotesImgs');
  state=normalise(blankState()); goto('labels');
}

route={view:'home',id:null,tab:'overview'};
render();
seedBlobs().then(()=>{document.querySelectorAll('[data-img]').forEach(e=>{e.dataset.done=''});paintImages();},()=>{});
