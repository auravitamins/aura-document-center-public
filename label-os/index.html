/* ===================================================================
   STATE, MIGRATION, PERSISTENCE
   =================================================================== */
const KEY='labelOS.v3';
const OLDKEY='labelQuotes.v2';
const BACKUPKEY='labelQuotes.v2.rescued';

const COLLECTIONS=['suppliers','labels','artworks','requests','quotes','freight','movements',
                   'evidence','tasks','activity','pos','schedules','payments','shipments',
                   'shipmentLines','receipts','receiptLines','lots','claims','issues'];

function blankState(){
  const s={v:3,seq:{},settings:{fx:0.1405,eur:1.08,me:''}};
  COLLECTIONS.forEach(c=>s[c]=[]);
  return s;
}
function normalise(s){
  s.v=3; s.seq=s.seq||{};
  s.settings=Object.assign({fx:0.1405,eur:1.08,me:''},s.settings||{});
  COLLECTIONS.forEach(c=>{if(!Array.isArray(s[c]))s[c]=[]});
  return s;
}

/* ---------- v2 -> v3 -----------------------------------------------
   The old file kept one case object holding quotes, freight, stock,
   images and checks. Each of those becomes its own record joined by id.
   Nothing is dropped, and the raw v2 blob is kept under its own key.   */
function migrateV2(old){
  const s=blankState();
  s.settings=Object.assign(s.settings,{fx:num(old.settings&&old.settings.fx)||0.1405,
                                       eur:num(old.settings&&old.settings.eur)||1.08,
                                       me:(old.settings&&old.settings.me)||''});
  state=s;                                   /* nextId() reads the live counters */

  /* suppliers, deduplicated on a trimmed lower case name */
  const byName={};
  const supplierFor=raw=>{
    const name=String(raw||'').trim();
    if(!name)return null;
    const k=name.toLowerCase();
    if(byName[k])return byName[k];
    const sup={id:nextId('supplier'),name:name,company:'',contact:name,whatsapp:'',email:'',
      country:'',currency:'USD',terms:'',notes:'',active:true,created:today(),
      legacyName:name};
    s.suppliers.push(sup); byName[k]=sup.id; return sup.id;
  };
  if(old.settings&&old.settings.supplier)supplierFor(old.settings.supplier);

  (old.cases||[]).forEach(c=>{
    const label={
      id:nextId('label'),legacyId:c.id,
      sku:c.sku||'',name:c.name||'Untitled label',
      family:'',product:'',market:'',brand:c.brand||'',
      size:c.size||'',material:c.material||'',finish:c.finish||'',printing:c.printing||'',
      adhesive:c.adhesive||'',core:'',winding:'',
      preferredSupplierId:null,currentArtworkId:null,
      status:'Active',
      askedQty:c.askedQty||'',request:c.request||'',notes:c.notes||'',
      usage:c.usage||'',reorderAt:c.reorderAt||'',safetyDays:'30',
      created:c.created||today(),modified:today()
    };
    s.labels.push(label);

    /* every migrated label gets a version 1 so a purchase order always has
       something immutable to point at */
    const art={id:nextId('artwork'),labelId:label.id,version:'v1',status:'Draft',
      evidenceId:null,reason:'Carried over from the previous version of Label OS',
      notes:'',createdAt:label.created,submittedAt:'',approvedAt:'',approvedBy:'',
      supplierId:null,supplierConfirmed:false,supplierConfirmedAt:'',
      proofReceived:false,proofReceivedAt:'',proofApproved:false,proofApprovedAt:''};
    s.artworks.push(art);
    label.currentArtworkId=art.id;

    /* case level images become evidence; the first one becomes the artwork file */
    (c.images||[]).forEach((im,i)=>{
      const ev={id:nextId('evidence'),imgId:im.id,name:im.name||'',mime:im.type||'',
        caption:im.caption||'',labelId:label.id,date:im.added||label.created,
        entity:i===0?'artwork':'label', entityId:i===0?art.id:label.id,
        type:i===0?'Artwork':'Document'};
      s.evidence.push(ev);
      if(i===0){
        art.evidenceId=ev.id;
        if(/approved/i.test(im.caption||'')){art.status='Approved';art.approvedAt=label.created;art.approvedBy='Jimmy';}
      }
    });

    (c.quotes||[]).forEach(q=>{
      const quote={id:nextId('quote'),legacyId:q.id,labelId:label.id,
        supplierId:supplierFor(q.supplier),requestId:null,
        date:q.date||'',currency:q.currency||'USD',expires:'',
        moq:q.moq||'',plateFee:q.plate||'',sampleFee:q.sample||'',productionDays:q.lead||'',
        shipMethod:q.shipMethod||'',terms:q.terms||'',source:q.source||'',notes:q.notes||'',
        lines:(q.tiers||[]).map(t=>({id:nextId('line'),qty:t.qty,price:t.price,
          ship:(t.ship==null?'':t.ship),exw:(t.exw==null?'':t.exw),
          plate:'',sample:'',other:'',note:''}))};
      s.quotes.push(quote);
      if(!label.preferredSupplierId&&quote.supplierId)label.preferredSupplierId=quote.supplierId;
      (q.images||[]).forEach(im=>s.evidence.push({id:nextId('evidence'),imgId:im.id,
        name:im.name||'',mime:im.type||'',caption:im.caption||'',labelId:label.id,
        date:im.added||quote.date,entity:'quote',entityId:quote.id,type:'Quote message'}));
    });

    if(label.askedQty||label.request){
      const req={id:nextId('request'),labelId:label.id,
        supplierId:label.preferredSupplierId,artworkId:art.id,
        date:label.created,quantities:label.askedQty,requirements:'',destination:'',
        status:s.quotes.some(x=>x.labelId===label.id)?'Partially Quoted':'Sent',
        notes:label.request};
      s.requests.push(req);
      s.quotes.filter(x=>x.labelId===label.id&&!x.requestId).forEach(x=>x.requestId=req.id);
    }

    (c.freight||[]).forEach(f=>s.freight.push({id:nextId('freight'),labelId:label.id,
      carrier:f.carrier||'',method:f.method||'',currency:f.currency||'USD',
      flat:f.flat||'',perK:f.perK||'',days:f.days||'',source:f.source||'',notes:f.notes||''}));

    const MAP={'in':'Receipt','out':'Usage','count':'Count'};
    (c.stock||[]).forEach(m=>s.movements.push({id:nextId('movement'),labelId:label.id,
      date:m.date||today(),type:MAP[m.type]||'Adjustment',qty:m.qty,
      artworkId:null,note:m.note||'',poId:null,ref:''}));

    (c.checks||[]).forEach(k=>s.tasks.push({id:nextId('task'),labelId:label.id,
      entity:'label',entityId:label.id,text:k.text||'',done:!!k.done}));

    s.activity.push({id:nextId('activity'),at:nowISO(),entity:'label',entityId:label.id,
      labelId:label.id,what:'Carried over from the previous version of Label OS'});
  });
  return s;
}


/* ---------- v3 -> v4 -------------------------------------------------
   Movements used to float free against a label. They are replayed in
   date order so each receipt becomes a lot and every consumption is
   allocated first in first out, splitting a movement across lots where
   it genuinely spanned them. Balances come out identical, they are just
   traceable now. Where stock existed with no receipt behind it, one
   clearly marked legacy lot is created rather than inventing a supplier,
   a purchase order or a receiving history.                             */
function migrateV3toV4(s){
  state=s;   /* nextId reads the live counters while replaying */
  const MAP={'Receipt':'Receipt','in':'Receipt','Usage':'Usage','out':'Usage',
    'Count':'Count adjustment','count':'Count adjustment','Adjustment':'Manual adjustment',
    'Reserve':'Reserve','Release reservation':'Release reservation','Quarantine':'Quarantine',
    'Release quarantine':'Release quarantine','Mark obsolete':'Mark obsolete','Destroy':'Destroy'};
  const kept=s.movements.filter(m=>!s.labels.some(l=>l.id===m.labelId));
  s.labels.forEach(lb=>{
    const ms=s.movements.filter(m=>m.labelId===lb.id)
      .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.id).localeCompare(String(b.id)));
    if(!ms.length)return;
    const lots=[], out=[];
    const mkLot=(artworkId,qty,date,why)=>{
      const lot={id:nextId('lot'),labelId:lb.id,artworkId:artworkId||lb.currentArtworkId||null,
        supplierId:null,poId:null,receiptId:null,createdDate:date||today(),receivedDate:date||today(),
        originalQty:qty,unitCost:null,costBasis:null,source:LOT_SOURCE.LEGACY,
        disposition:'',notes:why||'Carried over from before lots existed',status:'Open'};
      s.lots.push(lot);
      const l={id:lot.id,artworkId:lot.artworkId,remaining:0,date:lot.receivedDate};
      lots.push(l); return l;
    };
    const emit=(m,lotId,type,qty)=>{
      out.push({id:nextId('movement'),labelId:lb.id,lotId:lotId,type:type,qty:qty,
        from:m.from||'',date:m.date||today(),createdAt:m.createdAt||nowISO(),
        groupId:m.groupId||rid('g'),refType:'migrated',refId:m.id||'',
        reason:m.reason||'',note:m.note||'',artworkId:m.artworkId||(byId('lots',lotId)||{}).artworkId||null});
    };
    const fifo=(m,type,qty)=>{                       /* oldest lot first */
      let left=qty;
      for(const l of lots){
        if(left<=0)break;
        if(l.remaining<=0)continue;
        const take=Math.min(l.remaining,left);
        l.remaining-=take; left-=take; emit(m,l.id,type,take);
      }
      if(left>0){                                    /* consumption with nothing behind it */
        const l=mkLot(m.artworkId,0,m.date,'Created so a legacy consumption had somewhere to sit');
        l.remaining-=left; emit(m,l.id,type,left);
      }
    };
    let running=0;
    ms.forEach(m=>{
      const q=num(m.qty), type=MAP[m.type]||m.type;
      if(type==='Receipt'){
        const l=mkLot(m.artworkId,q,m.date,'Receipt carried over from the previous version');
        l.remaining+=q; running+=q; emit(m,l.id,'Receipt',q);
      }else if(type==='Usage'||type==='Destroy'){
        running-=q; fifo(m,type,q);
      }else if(type==='Count adjustment'){
        const delta=q-running; running=q;
        if(!delta)return;
        if(delta<0){
          let left=-delta;
          for(const l of lots){ if(left<=0)break; if(l.remaining<=0)continue;
            const take=Math.min(l.remaining,left); l.remaining-=take; left-=take;
            emit(m,l.id,'Count adjustment',-take); }
          if(left>0){const l=mkLot(m.artworkId,0,m.date,'Legacy count shortfall');l.remaining-=left;emit(m,l.id,'Count adjustment',-left);}
        }else{
          const l=lots.length?lots[lots.length-1]:mkLot(m.artworkId,0,m.date,'Legacy count surplus');
          l.remaining+=delta; emit(m,l.id,'Count adjustment',delta);
        }
      }else if(type==='Manual adjustment'){
        const signed=num(m.qty); running+=signed;
        const l=lots.length?lots[lots.length-1]:mkLot(m.artworkId,0,m.date,'Legacy adjustment');
        l.remaining+=signed; emit(m,l.id,'Manual adjustment',signed);
      }else{                                        /* reserve, quarantine, obsolete and releases */
        let left=q;
        for(const l of lots){ if(left<=0)break; if(l.remaining<=0)continue;
          const take=Math.min(l.remaining,left); left-=take; emit(m,l.id,type,take); }
        if(left>0){ const l=lots.length?lots[lots.length-1]:mkLot(m.artworkId,0,m.date,'Legacy state movement');
          emit(m,l.id,type,left); }
      }
    });
    /* record what each lot actually started with */
    lots.forEach(l=>{const lot=byId('lots',l.id);
      if(lot&&!lot.originalQty)lot.originalQty=out.filter(o=>o.lotId===l.id&&o.type==='Receipt')
        .reduce((a,o)=>a+num(o.qty),0);});
    kept.push.apply(kept,out);
  });
  s.movements=kept;
  s.v=4;
  s.lotsMigratedAt=nowISO();
  return s;
}

let state=blankState();
function loadState(){
  try{
    const cur=localStorage.getItem(KEY);
    if(cur){
      const s=JSON.parse(cur);
      if(!SNAPSHOT||s.snapshot===SNAPSHOT){
        const n=normalise(s);
        return num(n.v)>=4?n:normalise(migrateV3toV4(n));
      }
    }
  }catch(e){console.warn('v3 load failed',e)}
  try{
    const old=localStorage.getItem(OLDKEY);
    if(old){
      const parsed=JSON.parse(old);
      if(parsed&&Array.isArray(parsed.cases)&&parsed.cases.length){
        localStorage.setItem(BACKUPKEY,old);        /* never destroy the old blob */
        const s=normalise(migrateV3toV4(normalise(migrateV2(parsed))));
        s.migratedFrom='v2'; s.migratedAt=nowISO();
        return s;
      }
    }
  }catch(e){console.warn('v2 migration failed',e)}
  return normalise(JSON.parse(JSON.stringify(SEED)));
}
let _sv;
function save(now){
  clearTimeout(_sv);
  state.snapshot=SNAPSHOT;
  state.lastChange=nowISO();
  const w=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}
              catch(e){toast('Could not save, browser storage is full')}};
  if(now)w(); else _sv=setTimeout(w,250);
}
function logActivity(entity,entityId,labelId,what){
  state.activity.push({id:nextId('activity'),at:nowISO(),entity,entityId,labelId,what});
  if(state.activity.length>4000)state.activity=state.activity.slice(-3000);
}

/* ---------- lookups ---------- */
const byId=(coll,id)=>id?(state[coll]||[]).find(x=>x.id===id)||null:null;
const label=id=>byId('labels',id);
const supplier=id=>byId('suppliers',id);
const artwork=id=>byId('artworks',id);
const supplierName=id=>{const s=supplier(id);return s?s.name:'—'};
const quotesFor=lid=>state.quotes.filter(q=>q.labelId===lid);
const artworksFor=lid=>state.artworks.filter(a=>a.labelId===lid)
  .sort((a,b)=>(parseFloat(String(a.version).replace(/\D/g,''))||0)-(parseFloat(String(b.version).replace(/\D/g,''))||0));
const freightFor=lid=>state.freight.filter(f=>f.labelId===lid);
const movesFor=lid=>state.movements.filter(m=>m.labelId===lid);
const tasksFor=lid=>state.tasks.filter(t=>t.labelId===lid);
const evidenceFor=(entity,entityId)=>state.evidence.filter(e=>e.entity===entity&&e.entityId===entityId);
const activityFor=lid=>state.activity.filter(a=>a.labelId===lid).slice().reverse();

/* ===================================================================
   PRICING  ·  carried over unchanged in behaviour, rewired to ids
   =================================================================== */
function fx(cur){return cur==='CNY'?num(state.settings.fx):cur==='EUR'?num(state.settings.eur):1}
function linesOf(q){
  return (q.lines||[]).map(l=>({id:l.id,qty:num(l.qty),price:num(l.price),
      ship:has(l.ship)?num(l.ship):null, exw:has(l.exw)?num(l.exw):null,
      plate:has(l.plate)?num(l.plate):null, sample:has(l.sample)?num(l.sample):null,
      other:has(l.other)?num(l.other):null}))
    .filter(l=>l.qty>0&&l.price>0).sort((a,b)=>a.qty-b.qty);
}
function freightCost(f,qty){return (num(f.flat)+num(f.perK)*qty/1000)*fx(f.currency)}
/* every way to move this quantity: the supplier's own price competes with
   each forwarder logged against the label */
function shipChoices(labelId,q,line){
  const out=[];
  if(line.ship!=null)out.push({name:supplierName(q.supplierId)+', her shipping',cost:line.ship*fx(q.currency),own:true});
  freightFor(labelId).forEach(f=>{
    if(!has(f.flat)&&!has(f.perK))return;
    out.push({name:f.carrier||'Forwarder',cost:freightCost(f,line.qty),own:false,id:f.id});
  });
  return out.sort((a,b)=>a.cost-b.cost);
}
function lineCost(q,line){
  const r=fx(q.currency);
  const goods=line.price*line.qty*r;
  const plate=(line.plate!=null?line.plate:num(q.plateFee))*r;
  const sample=(line.sample!=null?line.sample:num(q.sampleFee))*r;
  const other=(line.other!=null?line.other:0)*r;
  const fixed=plate+sample+other;
  const ch=shipChoices(q.labelId,q,line);
  const pick=ch[0]||{name:'',cost:0};
  const own=ch.find(x=>x.own);
  const total=goods+fixed+pick.cost;
  return {qty:line.qty,unit:line.price*r,goods,fixed,plate,sample,other,ship:pick.cost,total,
    per:total/line.qty,line,q,shipName:pick.name,shipOwn:!!pick.own,choices:ch,
    saved:(own&&!pick.own)?own.cost-pick.cost:0,
    mismatch:line.exw!=null&&Math.abs(line.price*line.qty-line.exw)>Math.max(0.5,line.exw*0.01)};
}
function optionsFor(labelId){
  const out=[];
  quotesFor(labelId).forEach(q=>linesOf(q).forEach(l=>out.push(lineCost(q,l))));
  return out.sort((a,b)=>a.per-b.per);
}

/* ===================================================================
   INVENTORY  ·  lots and movements

   SIGN CONVENTION
   Quantities are stored as positive magnitudes and the movement type
   carries the direction. The two adjustment types are the only ones
   allowed to hold a negative quantity, because for an adjustment the
   direction is part of the fact being recorded.

   STATE MODEL
   Every balance is derived per lot and the label totals are the sum of
   its lots plus anything not yet allocated to one. Reserved, quarantined
   and obsolete quantities stay inside remaining, they are not taken out
   of it, so nothing is ever subtracted twice:

     remaining = receipts + adjustments - usage - destroyed - returned
     available = remaining - reserved - quarantined - obsolete - rejected
   =================================================================== */
const MOVE_IN=['Receipt'];
const MOVE_OUT=['Usage','Destroy','Return to supplier'];
const MOVE_ADJ=['Count adjustment','Manual adjustment'];
const MOVE_STATE=['Reserve','Release reservation','Quarantine','Release quarantine',
                  'Reject','Release rejection','Mark obsolete','Restore from obsolete'];
const MOVE_TYPES=MOVE_IN.concat(MOVE_OUT,MOVE_ADJ,MOVE_STATE);
const MOVE_HELP={
  'Receipt':'labels came into our custody','Usage':'labels went onto product',
  'Destroy':'physically thrown away, it no longer exists',
  'Count adjustment':'difference found by counting the shelf',
  'Manual adjustment':'a correction, with a reason',
  'Reserve':'set aside for a job, still on the shelf',
  'Release reservation':'no longer set aside','Quarantine':'held back pending a decision',
  'Release quarantine':'returned to usable stock','Mark obsolete':'kept but no longer printable',
  'Restore from obsolete':'usable again',
  'Reject':'failed inspection, physically here but never usable',
  'Release rejection':'accepted after all, back to usable stock',
  'Return to supplier':'sent back, it has left our custody'
};
const ADJ_REASONS=['Data correction','Damaged internally','Missing stock','Found stock',
                   'Migration correction','Other'];
const LOT_SOURCE={PO:'Purchase order',LEGACY:'Legacy migration',MANUAL:'Manual entry',RECEIPT:'Receipt'};

const lotsFor=lid=>state.lots.filter(l=>l.labelId===lid);
const movesForLot=lotId=>state.movements.filter(m=>m.lotId===lotId);
const lotOrder=(a,b)=>String(a.receivedDate||a.createdDate||'').localeCompare(String(b.receivedDate||b.createdDate||''))
                     ||String(a.id).localeCompare(String(b.id));

/* balances of one lot, or of every movement with no lot when lotId is null */
function lotBalance(lotId){
  const ms=state.movements.filter(m=>(m.lotId||null)===(lotId||null));
  let received=0,used=0,destroyed=0,returned=0,adj=0,reserved=0,quarantined=0,obsolete=0,rejected=0;
  ms.forEach(m=>{
    const q=num(m.qty);
    switch(m.type){
      case 'Receipt': received+=q; break;
      case 'Usage': used+=q; break;
      case 'Destroy':
      case 'Return to supplier':
        if(m.type==='Destroy')destroyed+=q; else returned+=q;
        if(m.from==='quarantine')quarantined-=q;
        else if(m.from==='obsolete')obsolete-=q;
        else if(m.from==='rejected')rejected-=q;
        break;
      case 'Count adjustment':
      case 'Manual adjustment': adj+=q; break;      /* signed on purpose */
      case 'Reserve': reserved+=q; break;
      case 'Release reservation': reserved-=q; break;
      case 'Quarantine': quarantined+=q; break;
      case 'Release quarantine': quarantined-=q; break;
      case 'Reject': rejected+=q; break;
      case 'Release rejection': rejected-=q; break;
      case 'Mark obsolete': obsolete+=q; break;
      case 'Restore from obsolete': obsolete-=q; break;
    }
  });
  const remaining=received+adj-used-destroyed-returned;
  const res=Math.max(0,reserved),qua=Math.max(0,quarantined),
        obs=Math.max(0,obsolete),rej=Math.max(0,rejected);
  return {received,used,destroyed,returned,adj,remaining,
          reserved:res,quarantined:qua,obsolete:obs,rejected:rej,
          available:remaining-res-qua-obs-rej};
}
/* ON ORDER counts committed purchase orders, whether or not they have
   been shipped yet. incomingFor() breaks the same number into awaiting
   shipment, in transit and awaiting receipt so it is never double counted.
   A delivered shipment sits in AWAITING RECEIPT until a receipt is posted
   against it. Once posted, that quantity leaves incoming and becomes
   physical stock, so it is never counted in both places. */
function onOrderFor(labelId){ return incomingFor(labelId).incoming; }
function inventory(labelId){
  const lots=lotsFor(labelId).slice().sort(lotOrder);
  const per=lots.map(l=>({lot:l,bal:lotBalance(l.id)}));
  const t={onHand:0,reserved:0,quarantined:0,obsolete:0,rejected:0,available:0};
  per.forEach(x=>{t.onHand+=x.bal.remaining;t.reserved+=x.bal.reserved;
    t.quarantined+=x.bal.quarantined;t.obsolete+=x.bal.obsolete;
    t.rejected+=x.bal.rejected;t.available+=x.bal.available;});
  /* anything posted against this label but not yet tied to a lot */
  const loose=state.movements.filter(m=>m.labelId===labelId&&!m.lotId);
  let un=null;
  if(loose.length){
    const ids=loose.map(m=>m.id);
    const b={received:0,used:0,destroyed:0,adj:0,reserved:0,quarantined:0,obsolete:0};
    loose.forEach(m=>{const q=num(m.qty);
      if(m.type==='Receipt')b.received+=q; else if(m.type==='Usage')b.used+=q;
      else if(m.type==='Destroy'||m.type==='Return to supplier')b.destroyed+=q;
      else if(MOVE_ADJ.indexOf(m.type)>=0)b.adj+=q;});
    b.remaining=b.received+b.adj-b.used-b.destroyed;
    b.available=b.remaining;
    if(b.remaining!==0||ids.length){
      un={ids:ids,bal:b};
      t.onHand+=b.remaining; t.available+=b.remaining;
    }
  }
  const byArt={};
  per.forEach(x=>{if(x.bal.remaining>0){const k=x.lot.artworkId||'unknown';
    byArt[k]=(byArt[k]||0)+x.bal.remaining;}});
  const onOrder=onOrderFor(labelId);
  return Object.assign(t,{onOrder:onOrder,position:t.available+onOrder,
    lots:per,unallocated:un,byArt:byArt,
    tracked:lots.length>0||state.movements.some(m=>m.labelId===labelId)});
}

/* ---------- allocation ----------
   Oldest eligible lot first. Capacity is whatever that lot can give for
   the kind of movement being posted, so a lot cannot lend out stock that
   is reserved, quarantined or already gone. */
const CAPACITY={
  'Usage':b=>b.available, 'Reserve':b=>b.available, 'Quarantine':b=>b.available,
  'Reject':b=>b.available, 'Mark obsolete':b=>b.available,
  'Release reservation':b=>b.reserved, 'Release quarantine':b=>b.quarantined,
  'Release rejection':b=>b.rejected, 'Restore from obsolete':b=>b.obsolete,
  'Destroy':(b,from)=>from==='quarantine'?b.quarantined:from==='obsolete'?b.obsolete
    :from==='rejected'?b.rejected:b.available,
  'Return to supplier':(b,from)=>from==='rejected'?b.rejected:from==='quarantine'?b.quarantined:b.available
};
function capacityFor(labelId,type,from){
  const f=CAPACITY[type]; if(!f)return Infinity;
  return lotsFor(labelId).reduce((a,l)=>a+Math.max(0,f(lotBalance(l.id),from)),0);
}
function allocate(labelId,type,qty,from){
  const f=CAPACITY[type]; if(!f)return null;
  const lots=lotsFor(labelId).slice().sort(lotOrder);
  const out=[]; let left=qty;
  for(const l of lots){
    if(left<=0)break;
    const cap=Math.max(0,f(lotBalance(l.id),from));
    if(cap<=0)continue;
    const take=Math.min(cap,left);
    out.push({lotId:l.id,qty:take}); left-=take;
  }
  return left>0?null:out;
}

/* ---------- posting ----------
   Every posting is refused rather than allowed to create an impossible
   state. Corrections are made by posting another movement, never by
   editing history. */
function postMovement(labelId,type,qty,opts){
  opts=opts||{};
  const q=Math.abs(num(qty));
  if(!q&&MOVE_ADJ.indexOf(type)<0){toast('Enter a quantity first');return null;}
  const lb=label(labelId);
  const group=rid('g');
  const rows=[];
  const add=(lotId,amount,artworkId)=>{
    const m={id:nextId('movement'),labelId:labelId,lotId:lotId||null,type:type,
      qty:amount,from:opts.from||'',date:opts.date||today(),createdAt:nowISO(),groupId:group,
      refType:opts.refType||'',refId:opts.refId||'',reason:opts.reason||'',note:opts.note||'',
      artworkId:artworkId||null};
    state.movements.push(m); rows.push(m); return m;
  };
  if(type==='Receipt'){
    /* a receipt is a lot: this is the only way physical stock appears */
    const lot={id:nextId('lot'),labelId:labelId,
      artworkId:opts.artworkId||(lb?lb.currentArtworkId:null),
      supplierId:opts.supplierId||null,poId:opts.poId||null,
      shipmentId:opts.shipmentId||null,receiptId:opts.receiptId||null,receiptLineId:opts.receiptLineId||null,
      createdDate:today(),receivedDate:opts.date||today(),
      originalQty:q,unitCost:opts.unitCost==null?null:opts.unitCost,
      costBasis:opts.costBasis||null,source:opts.source||LOT_SOURCE.MANUAL,
      disposition:'',notes:opts.note||'',status:'Open'};
    state.lots.push(lot);
    add(lot.id,q,lot.artworkId);
    logActivity('lot',lot.id,labelId,'Lot '+lot.id+' created, '+int(q)+' labels'
      +(opts.poId?' from '+opts.poId:'')+(opts.artworkId?' on '+((artwork(opts.artworkId)||{}).version||''):''));
    save(true); return rows;
  }
  if(MOVE_ADJ.indexOf(type)>=0){
    const signed=num(qty);
    let lotId=opts.lotId||null;
    if(!lotId){
      const live=lotsFor(labelId).filter(l=>lotBalance(l.id).remaining>0);
      if(live.length===1)lotId=live[0].id;                    /* unambiguous */
      else if(signed<0){                                       /* take it off the oldest first */
        const plan=allocate(labelId,'Usage',Math.abs(signed));
        if(plan){plan.forEach(p=>add(p.lotId,-p.qty,null));
          logActivity('movement',group,labelId,type+' of '+int(signed)+' across '+plan.length+' lot'+(plan.length===1?'':'s')
            +(opts.reason?', '+opts.reason:''));
          save(true);return rows;}
      }
    }
    add(lotId,signed,null);
    logActivity('movement',group,labelId,type+' of '+(signed>0?'+':'')+int(signed)
      +(lotId?' on '+lotId:', not yet allocated to a lot')+(opts.reason?', '+opts.reason:''));
    save(true); return rows;
  }
  if(opts.lotId){                       /* aimed at one lot, e.g. an artwork decision */
    const f=CAPACITY[type];
    const cap1=f?Math.max(0,f(lotBalance(opts.lotId),opts.from)):Infinity;
    if(q>cap1+0.0001){alert('Only '+int(cap1)+' can be moved on '+opts.lotId+'.');return null;}
    const l=byId('lots',opts.lotId);
    add(opts.lotId,q,l?l.artworkId:null);
    logActivity('movement',group,labelId,type+' of '+int(q)+' on '+opts.lotId+(opts.reason?', '+opts.reason:''));
    save(true); return rows;
  }
  const cap=capacityFor(labelId,type,opts.from);
  if(q>cap+0.0001){
    const src=f=>f==='quarantine'?'quarantined':f==='obsolete'?'obsolete':f==='rejected'?'rejected':'available';
    const what={'Usage':'available','Reserve':'available','Quarantine':'available','Reject':'available',
      'Mark obsolete':'available','Release reservation':'reserved','Release quarantine':'quarantined',
      'Release rejection':'rejected','Restore from obsolete':'obsolete',
      'Destroy':src(opts.from),'Return to supplier':src(opts.from)}[type];
    alert('Only '+int(cap)+' '+what+'. '+type+' of '+int(q)+' would leave the stock in a state that cannot be true.'
      +(type==='Usage'?'\n\nIf stock really did leave without being recorded, post a Manual adjustment with a reason instead.':''));
    return null;
  }
  const plan=allocate(labelId,type,q,opts.from);
  if(!plan){alert('That quantity cannot be allocated across the lots available.');return null;}
  plan.forEach(p=>{const l=byId('lots',p.lotId);add(p.lotId,p.qty,l?l.artworkId:null)});
  logActivity('movement',group,labelId,type+' of '+int(q)+' across '+plan.length+' lot'+(plan.length===1?'':'s')
    +' ('+plan.map(p=>p.lotId+' '+int(p.qty)).join(', ')+')'+(opts.reason?', '+opts.reason:''));
  save(true); return rows;
}
/* a posted movement is reversed, never deleted */
function reverseMovement(id){
  const m=byId('movements',id); if(!m)return;
  const REV={'Usage':'Receipt','Receipt':'Usage','Reserve':'Release reservation',
    'Release reservation':'Reserve','Quarantine':'Release quarantine',
    'Release quarantine':'Quarantine','Reject':'Release rejection','Release rejection':'Reject',
    'Mark obsolete':'Restore from obsolete','Restore from obsolete':'Mark obsolete'};
  if(m.type==='Receipt'){alert('A receipt is what created the lot. Use a Manual adjustment with a reason, or destroy the stock.');return;}
  if(MOVE_ADJ.indexOf(m.type)>=0){
    if(!confirm('Post the opposite adjustment to cancel this one out?'))return;
    state.movements.push({id:nextId('movement'),labelId:m.labelId,lotId:m.lotId,type:'Manual adjustment',
      qty:-num(m.qty),from:'',date:today(),createdAt:nowISO(),groupId:rid('g'),
      refType:'reversal',refId:m.id,reason:'Data correction',note:'Reverses '+m.id,artworkId:m.artworkId});
    logActivity('movement',m.id,m.labelId,'Adjustment '+m.id+' reversed');
    save(true);render();return;
  }
  if(m.type==='Destroy'||m.type==='Return to supplier'){alert('Stock that has left cannot be brought back this way. Post a Receipt if it turns out it never left.');return;}
  const rev=REV[m.type]; if(!rev)return;
  if(!confirm('Post a '+rev+' of '+int(num(m.qty))+' to reverse '+m.id+'? The original stays in the history.'))return;
  state.movements.push({id:nextId('movement'),labelId:m.labelId,lotId:m.lotId,type:rev,
    qty:num(m.qty),from:'',date:today(),createdAt:nowISO(),groupId:rid('g'),
    refType:'reversal',refId:m.id,reason:'',note:'Reverses '+m.id,artworkId:m.artworkId});
  logActivity('movement',m.id,m.labelId,m.type+' '+m.id+' reversed by a '+rev);
  save(true);render();
}
/* a count states the physical truth, the difference is posted as an adjustment */
function postCount(labelId,counted,opts){
  opts=opts||{};
  const inv=inventory(labelId);
  const delta=num(counted)-inv.onHand;
  if(!delta){toast('The count matches the record, nothing to post');return null;}
  const live=lotsFor(labelId).filter(l=>lotBalance(l.id).remaining>0);
  const lotId=opts.lotId||(live.length===1?live[0].id:null);
  const rows=postMovement(labelId,'Count adjustment',delta,
    {lotId:lotId,date:opts.date||today(),reason:'Physical count',
     note:opts.note||('Counted '+int(counted)+' against '+int(inv.onHand)+' on record')});
  if(rows&&!lotId&&live.length>1)
    toast('Counted difference posted but not allocated to a lot yet');
  return rows;
}

/* ---------- artwork conflicts ---------- */
function artworkConflicts(labelId){
  const lb=label(labelId); if(!lb||!lb.currentArtworkId)return [];
  return lotsFor(labelId).map(l=>({lot:l,bal:lotBalance(l.id)}))
    .filter(x=>x.lot.artworkId&&x.lot.artworkId!==lb.currentArtworkId
               &&x.bal.available>0&&x.lot.disposition!=='Use remaining')
    .map(x=>({artworkId:x.lot.artworkId,lotId:x.lot.id,qty:x.bal.remaining,
              available:x.bal.available,art:artwork(x.lot.artworkId),lot:x.lot}));
}

/* ---------- usage and replenishment ---------- */
function usageRate(lb){                        /* labels per month */
  if(has(lb.usage))return {perMonth:num(lb.usage),source:'manual'};
  const ms=movesFor(lb.id).filter(m=>m.type==='Usage'&&has(m.qty));
  if(!ms.length)return {perMonth:0,source:'none'};
  const dates=ms.map(m=>new Date(m.date)).filter(d=>!isNaN(d));
  if(!dates.length)return {perMonth:0,source:'none'};
  const span=Math.max(30,(Math.max.apply(null,dates)-Math.min.apply(null,dates))/86400000);
  const total=ms.reduce((a,m)=>a+num(m.qty),0);
  return {perMonth:total/span*30,source:'derived',months:(span/30).toFixed(1)};
}
function leadDays(lb){
  const o=optionsFor(lb.id)[0]; if(!o)return null;
  const prod=num(o.q.productionDays);
  let ship=0;
  const pick=(o.choices||[]).find(x=>x.name===o.shipName);
  if(pick&&!pick.own){const f=byId('freight',pick.id); if(f)ship=num(f.days);}
  if(!prod&&!ship)return null;
  return prod+ship;
}
function coverDays(lb){
  const per=usageRate(lb).perMonth/30;
  if(per<=0)return null;
  return inventory(lb.id).available/per;
}
function reorderPoint(lb){
  if(has(lb.reorderAt))return num(lb.reorderAt);
  const per=usageRate(lb).perMonth/30, ld=leadDays(lb);
  if(per<=0||ld==null)return null;
  return Math.round(per*(ld+(num(lb.safetyDays)||30)));
}
function stockState(lb){
  const inv=inventory(lb.id);
  if(!inv.tracked)return 'none';
  const rp=reorderPoint(lb);
  if(inv.available<=0)return 'out';
  if(rp!=null&&inv.available<=rp)return 'low';
  return 'ok';
}

/* ===================================================================
   OPEN ISSUES  ·  derived for now, each carries a stable key so the
   alerts milestone can persist status and due dates against it
   =================================================================== */
function issuesFor(labelId){
  const lb=label(labelId); if(!lb)return [];
  const f=[], qs=quotesFor(labelId);
  const push=(sev,key,text)=>f.push({severity:sev,key:key,text:text});

  /* artwork */
  const arts=artworksFor(labelId), cur=artwork(lb.currentArtworkId);
  if(!arts.length)push('warn','art.none','No artwork version recorded. A purchase order has to point at a specific version.');
  else if(!cur)push('bad','art.nocurrent','No current artwork is set for this label. Mark one version as current before ordering.');
  else if(cur.status!=='Approved')push('warn','art.unapproved','Current artwork '+esc(cur.version)+' is '+esc(cur.status).toLowerCase()+', not approved. Do not commit a run against it yet.');
  if(cur&&cur.status==='Approved'&&!cur.supplierConfirmed)
    push('info','art.unconfirmed','The supplier has not confirmed artwork '+esc(cur.version)+' in writing.');
  artworkConflicts(labelId).forEach(c=>push('bad','art.conflict.'+c.artworkId,
    int(c.qty)+' labels in stock still carry artwork '+esc(c.art?c.art.version:'unknown')
    +', but '+esc(cur?cur.version:'the current version')+' is current. Decide whether to use, quarantine or write them off.'));

  /* quotes */
  if(!qs.length)push('info','quote.none','No quote logged yet.');
  qs.forEach(q=>{
    const who=esc(supplierName(q.supplierId)), ls=linesOf(q);
    if(!ls.length){push('warn','quote.empty.'+q.id,who+' has no prices entered yet.');return;}
    ls.forEach(l=>{
      const c=lineCost(q,l);
      if(c.mismatch)push('bad','quote.math.'+l.id,who+' quoted '+int(l.qty)+' at '+CUR[q.currency]+l.price
        +' each, which is '+money(l.price*l.qty)+', but wrote a total of '+money(l.exw)
        +'. Her arithmetic does not add up on that line.');
    });
    for(let i=1;i<ls.length;i++){
      const a=lineCost(q,ls[i-1]), b=lineCost(q,ls[i]);
      if(b.per>=a.per)push('bad','quote.ladder.'+ls[i].id,who+"'s "+int(ls[i].qty)+' price is not better per label than '
        +int(ls[i-1].qty)+' ('+each(b.per)+' vs '+each(a.per)+'). Ordering more should never cost more each.');
      if(ls[i].price===ls[i-1].price)push('warn','quote.dup.'+ls[i].id,who+' used the same unit price at '
        +int(ls[i-1].qty)+' and '+int(ls[i].qty)+'. That is usually a copy and paste, not a real quote.');
    }
    const asked=String(lb.askedQty||'').split(/[,;/]+/)
      .map(x=>num(x.replace(/[^0-9.]/g,''))*(/k\b/i.test(x)?1000:1)).filter(x=>x>0);
    const miss=asked.filter(a=>!ls.some(l=>l.qty===a));
    if(miss.length)push('warn','quote.missing.'+q.id,'You asked for '+miss.map(int).join(' and ')
      +' but '+who+' never priced '+(miss.length>1?'those':'that')+'.');
    if(!has(q.plateFee))push('info','quote.plate.'+q.id,'No plate or die fee recorded for '+who+'.');
    if(!has(q.productionDays))push('info','quote.lead.'+q.id,'No production time from '+who+'. Shipping days are not the same as making the labels.');
  });

  /* shipping and the sweet spot */
  const o=optionsFor(labelId);
  if(o.length){
    const b=o[0];
    if(b.saved>0)push('ok','ship.saving','Shipping the '+int(b.qty)+' run with '+esc(b.shipName)+' instead of '
      +esc(supplierName(b.q.supplierId))+' saves '+money(b.saved)+'.');
    const own=(b.choices||[]).find(x=>x.own);
    if(own&&!freightFor(labelId).length&&own.cost>0&&own.cost/b.total>0.2)
      push('warn','ship.expensive','Her shipping is '+money(own.cost)+', '+(own.cost/b.total*100).toFixed(0)
        +'% of what you pay at '+int(b.qty)+'. Get an outside freight quote to Miami before accepting it.');
    const smallest=o.slice().sort((a,c)=>a.qty-c.qty)[0];
    if(b.qty>smallest.qty)push('ok','buy.sweetspot',int(b.qty)+' is the cheapest per label at '+each(b.per)
      +'. Stepping up from '+int(smallest.qty)+' costs '+money(b.total-smallest.total)+' more and gives you '
      +int(b.qty-smallest.qty)+' more labels, about '+each((b.total-smallest.total)/(b.qty-smallest.qty))+' each for the extra.');
  }

  /* stock */
  const inv=inventory(labelId);
  if(inv.tracked){
    const st=stockState(lb), cv=coverDays(lb), rp=reorderPoint(lb), ld=leadDays(lb);
    if(inv.onHand<0)push('bad','stock.negative','Stock has gone negative at '+int(inv.onHand)+'. A receipt is missing or a use was counted twice.');
    else if(st==='out')push('bad','stock.out','No usable stock left.');
    else if(st==='low')push('bad','stock.low',int(inv.available)+' available, at or under the reorder point of '+int(rp)+'.'
      +(ld!=null?' It takes about '+ld+' days to get more, so order now.':''));
    if(cv!=null&&ld!=null&&cv<ld)push('bad','stock.gap','You have '+Math.round(cv)+' days of labels but replenishment takes '
      +ld+' days. You run out roughly '+Math.round(ld-cv)+' days before a new run lands.');
    if(inv.quarantined>0)push('warn','stock.quarantine',int(inv.quarantined)+' labels are quarantined and are not counted as available.');
  }
  const order={bad:0,warn:1,info:2,ok:3};
  return f.sort((a,b)=>order[a.severity]-order[b.severity]);
}


/* ===================================================================
   PURCHASE ORDERS AND PAYMENTS

   A purchase order never reads its commercial terms back out of the
   quote. It copies them once, at creation, into po.terms, and keeps an
   untouched copy in po.origin.terms. Editing the quote afterwards, or
   correcting a supplier's arithmetic, cannot rewrite what was committed.
   =================================================================== */
const PO_STATUS={
  procurement:['Draft','Awaiting Supplier Confirmation','Confirmed','Active','Completed','Cancelled'],
  artwork:['Not Sent','Sent','Awaiting Confirmation','Proof Pending','Proof Received','Changes Required','Approved','Problem'],
  payment:['Unpaid','Deposit Due','Partially Paid','Paid','Credit Pending','Refund Pending','Refunded'],
  production:['Not Started','Scheduled','In Production','QC','Complete','Delayed'],
  shipping:['Not Ready','Ready to Ship','Shipped','In Transit','Delivered']
};
const PO_DIM=[['procurement','Procurement'],['artworkStatus','Artwork'],['payment','Payment'],
              ['production','Production'],['shipping','Shipping']];
const PO_KEY={procurement:'procurement',artworkStatus:'artwork',payment:'payment',
              production:'production',shipping:'shipping'};
/* green means settled, amber means waiting on someone, red means a real problem */
const PO_TONE={
  'Confirmed':'ok','Active':'ok','Completed':'ok','Approved':'ok','Paid':'ok','Complete':'ok','Delivered':'ok',
  'Cancelled':'bad','Problem':'bad','Delayed':'bad','Changes Required':'bad',
  'Draft':'idle','Not Sent':'idle','Not Started':'idle','Not Ready':'idle','Unpaid':'idle'
};
const poTone=v=>PO_TONE[v]||'wait';

const PAY_TYPES=['Deposit','Balance','Freight','Plate / Die','Sample','Adjustment','Refund','Credit','Other'];
const SCHED_STATUS=['Upcoming','Due','Overdue','Paid','Waived'];

const posFor=lid=>state.pos.filter(p=>p.labelId===lid);
const schedulesFor=poId=>state.schedules.filter(s=>s.poId===poId);
const paymentsFor=poId=>state.payments.filter(p=>p.poId===poId);
const poNumber=p=>p.id;

/* money moves between currencies through the settings rates */
function conv(amount,from,to){
  if(!amount)return 0;
  if(from===to)return amount;
  return amount*fx(from)/fx(to||'USD');
}

/* ---------- create from a quote line ---------- */
function createPOFromLine(quoteId,lineId){
  const q=byId('quotes',quoteId); if(!q)return null;
  const l=linesOf(q).find(x=>x.id===lineId);
  if(!l){toast('That line needs a quantity and a price before it can be ordered');return null;}
  const lb=label(q.labelId);
  if(!q.supplierId){toast('Pick a supplier on the quote first');return null;}
  const c=lineCost(q,l);                       /* current best shipping choice */
  const cur=q.currency||'USD';
  const rate=fx(cur);
  const money2=v=>Math.round(v*1e6)/1e6;
  /* everything below is held in the quote's own currency, which is what the
     supplier is actually owed */
  const printSubtotal=money2(l.price*l.qty);
  const plate=money2(l.plate!=null?l.plate:num(q.plateFee));
  const sample=money2(l.sample!=null?l.sample:num(q.sampleFee));
  const other=money2(l.other!=null?l.other:0);
  const freight=money2(c.ship/rate);
  const total=money2(printSubtotal+plate+sample+other+freight);
  const terms={qty:l.qty,unitPrice:l.price,printSubtotal:printSubtotal,plateFee:plate,sampleFee:sample,
    otherCharges:other,freight:freight,freightSource:c.shipName||'',freightConfirmed:false,
    currency:cur,total:total,landedEach:money2(total/l.qty)};
  const po={
    id:nextId('po'),
    labelId:q.labelId,supplierId:q.supplierId,artworkId:lb?lb.currentArtworkId:null,
    quoteId:q.id,quoteLineId:l.id,
    terms:terms,
    origin:{quoteId:q.id,quoteLineId:l.id,quoteDate:q.date||'',supplierName:supplierName(q.supplierId),
            capturedAt:nowISO(),terms:JSON.parse(JSON.stringify(terms))},
    procurement:'Draft',artworkStatus:'Not Sent',payment:'Unpaid',production:'Not Started',shipping:'Not Ready',
    m:{created:today(),sent:'',supplierConfirmed:'',artworkApproved:'',productionStart:'',
       promisedComplete:'',actualComplete:''},
    notes:''
  };
  state.pos.push(po);
  logActivity('po',po.id,po.labelId,'Purchase order created from quote '+q.id+' line '+int(l.qty)
    +' at '+CUR[cur]+l.price+' each, committing '+CUR[cur]+total.toFixed(2));
  save(true);
  return po;
}

/* ---------- money -----------------------------------------------------
   COMMITTED  = printing + plates + samples + other + freight estimate
   PAID       = non voided payments, refunds counted negative
   CREDITS    = supplier credits granted against this order
   OUTSTANDING= COMMITTED - PAID - CREDITS
   Freight is kept visible on its own because it is still an estimate
   until a shipment record carries the real number.                     */
function poFinancials(po){
  const t=po.terms||{}, cur=t.currency||'USD';
  const orderValue=num(t.printSubtotal)+num(t.plateFee)+num(t.sampleFee)+num(t.otherCharges);
  const freight=num(t.freight);
  const committed=orderValue+freight;
  let paid=0,credits=0,refunds=0;
  paymentsFor(po.id).forEach(p=>{
    if(p.voided)return;
    const a=conv(num(p.amount),p.currency||cur,cur);
    if(p.type==='Credit')credits+=a;
    else if(p.type==='Refund'){refunds+=a;paid-=a;}
    else paid+=a;
  });
  const outstanding=committed-paid-credits;
  return {currency:cur,orderValue:orderValue,freight:freight,freightConfirmed:!!t.freightConfirmed,
    committed:committed,paid:paid,credits:credits,refunds:refunds,
    outstanding:Math.max(0,outstanding),overpaid:outstanding<-0.005?-outstanding:0,
    rawOutstanding:outstanding,landedEach:num(t.landedEach)};
}
function fmtCur(v,cur,d){
  const sym=CUR[cur]||'$';
  return sym+(isFinite(v)?v:0).toLocaleString('en-US',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d});
}

/* ---------- payment schedule ---------- */
function paidAgainst(scheduleId){
  return state.payments.filter(p=>p.scheduleId===scheduleId&&!p.voided)
    .reduce((a,p)=>a+(p.type==='Refund'?-1:1)*num(p.amount),0);
}
/* Paid is only claimed when payments are explicitly matched to the line. */
function scheduleStatus(sc){
  if(sc.waived)return 'Waived';
  const exp=num(sc.expectedAmount), got=paidAgainst(sc.id);
  if(exp>0&&got>=exp-0.005)return 'Paid';
  if(!sc.dueDate)return 'Upcoming';
  const d=String(sc.dueDate).slice(0,10), t=today();
  if(d<t)return 'Overdue';
  if(d===t)return 'Due';
  return 'Upcoming';
}
function addSchedule(poId,type,amount,due,desc){
  const po=byId('pos',poId); if(!po)return;
  state.schedules.push({id:nextId('schedule'),poId:poId,type:type||'Deposit',description:desc||'',
    dueDate:due||'',expectedAmount:amount==null?'':amount,currency:po.terms.currency||'USD',waived:false});
  save(true);
}
/* a starting point, not an assumption: the user can change every line */
function suggestSchedule(poId){
  const po=byId('pos',poId); if(!po)return;
  if(schedulesFor(poId).length){toast('This order already has a schedule');return;}
  const f=poFinancials(po);
  const half=Math.round(f.orderValue/2*100)/100;
  addSchedule(poId,'Deposit',half,'','50% of the printing, due on confirmation');
  addSchedule(poId,'Balance',Math.round((f.orderValue-half)*100)/100,'','Balance of the printing, due before shipment');
  if(f.freight>0)addSchedule(poId,'Freight',f.freight,'','Freight estimate, due before shipment');
  logActivity('po',poId,po.labelId,'Payment schedule drafted');
  save(true);render();
}
function recordPayment(poId,scheduleId){
  const po=byId('pos',poId); if(!po)return;
  const sc=scheduleId?byId('schedules',scheduleId):null;
  const owed=sc?Math.max(0,num(sc.expectedAmount)-paidAgainst(sc.id)):poFinancials(po).outstanding;
  const pay={id:nextId('payment'),poId:poId,scheduleId:scheduleId||null,
    type:sc?sc.type:'Balance',amount:Math.round(owed*100)/100,currency:po.terms.currency||'USD',
    datePaid:today(),method:'',reference:'',notes:'',voided:false};
  state.payments.push(pay);
  logActivity('po',poId,po.labelId,'Payment recorded, '+fmtCur(num(pay.amount),pay.currency)+(sc?' against '+sc.type:''));
  refreshPaymentStatus(po);
  save(true);render();
}
function voidPayment(id){
  const p=byId('payments',id); if(!p)return;
  if(!confirm('Void this payment? It stays in the history marked void, it is not deleted.'))return;
  p.voided=true; p.voidedAt=today();
  const po=byId('pos',p.poId);
  logActivity('po',p.poId,po?po.labelId:null,'Payment '+p.id+' voided, '+fmtCur(num(p.amount),p.currency));
  if(po)refreshPaymentStatus(po);
  save(true);render();
}
/* payment status follows the money, the other four dimensions never do */
function refreshPaymentStatus(po){
  const f=poFinancials(po);
  if(['Credit Pending','Refund Pending','Refunded'].indexOf(po.payment)>=0)return;
  let next='Unpaid';
  if(f.committed>0&&f.paid+f.credits>=f.committed-0.005)next='Paid';
  else if(f.paid+f.credits>0)next='Partially Paid';
  else{
    const due=schedulesFor(po.id).some(s=>['Due','Overdue'].indexOf(scheduleStatus(s))>=0);
    next=due?'Deposit Due':'Unpaid';
  }
  if(po.payment!==next){
    logActivity('po',po.id,po.labelId,'Payment status moved to '+next);
    po.payment=next;
  }
}

/* ---------- derived warnings, never silent status changes ---------- */
function poDelayDays(po){
  const d=po.m&&po.m.promisedComplete;
  if(!d||po.production==='Complete')return 0;
  const diff=Math.floor((new Date(today())-new Date(String(d).slice(0,10)))/86400000);
  return diff>0?diff:0;
}
function poArtworkDrift(po){
  const lb=label(po.labelId); if(!lb||!po.artworkId)return null;
  if(lb.currentArtworkId===po.artworkId)return null;
  return {po:artwork(po.artworkId),current:artwork(lb.currentArtworkId)};
}
function poAmended(po){
  if(!po.origin||!po.origin.terms)return [];
  const o=po.origin.terms,t=po.terms,out=[];
  [['qty','Quantity'],['unitPrice','Unit price'],['printSubtotal','Printing'],['plateFee','Plate or die'],
   ['sampleFee','Sample'],['otherCharges','Other charges'],['freight','Freight']].forEach(f=>{
    if(num(o[f[0]])!==num(t[f[0]]))out.push({field:f[1],from:o[f[0]],to:t[f[0]]});
  });
  return out;
}

/* ---------- PO issues, persisted with stable ids ---------- */
function upsertIssue(key,rec){
  let i=state.issues.find(x=>x.key===key);
  if(!i){
    i={id:nextId('issue'),key:key,status:'Open',createdAt:nowISO(),resolvedAt:'',resolution:''};
    state.issues.push(i);
  }
  Object.assign(i,rec);
  if(i.status==='Resolved'){i.status='Open';i.resolvedAt='';}
  return i;
}
function resolveIssue(key,how){
  const i=state.issues.find(x=>x.key===key);
  if(i&&i.status!=='Resolved'){i.status='Resolved';i.resolvedAt=nowISO();i.resolution=how||'Condition cleared';}
}
/* Runs on demand, keyed, so a condition that clears closes its own issue
   instead of leaving a stale alert behind. */
function syncPOIssues(po){
  const f=poFinancials(po), lb=label(po.labelId);
  const base={entity:'po',entityId:po.id,labelId:po.labelId};
  const set=(kind,on,rec)=>{
    const key='po.'+po.id+'.'+kind;
    if(on)upsertIssue(key,Object.assign({},base,rec));
    else resolveIssue(key);
  };
  set('confirm', po.procurement==='Awaiting Supplier Confirmation'&&!po.m.supplierConfirmed,
    {severity:'warn',category:'Procurement',title:'Waiting for the supplier to confirm this order'});
  set('artwork', ['Confirmed','Active'].indexOf(po.procurement)>=0&&po.artworkStatus!=='Approved',
    {severity:'warn',category:'Artwork',title:'Order is confirmed but the artwork is '+po.artworkStatus.toLowerCase()});
  set('noartwork', ['Confirmed','Active'].indexOf(po.procurement)>=0&&!po.artworkId,
    {severity:'bad',category:'Artwork',title:'Confirmed order has no artwork version attached'});
  const overdue=schedulesFor(po.id).filter(s=>scheduleStatus(s)==='Overdue');
  set('overdue', overdue.length>0,
    {severity:'bad',category:'Payment',title:overdue.length+' payment'+(overdue.length===1?'':'s')+' past the due date, '
      +fmtCur(overdue.reduce((a,s)=>a+Math.max(0,num(s.expectedAmount)-paidAgainst(s.id)),0),f.currency)+' owed'});
  const late=poDelayDays(po);
  set('late', late>0, {severity:'bad',category:'Production',
    title:late+' day'+(late===1?'':'s')+' past the promised completion date'});
  set('overpaid', f.overpaid>0, {severity:'warn',category:'Payment',
    title:'Payments exceed the commitment by '+fmtCur(f.overpaid,f.currency)});
  const drift=poArtworkDrift(po);
  set('drift', !!drift, drift?{severity:'warn',category:'Artwork',
    title:'Ordered on artwork '+(drift.po?drift.po.version:'?')+', but '
      +(drift.current?drift.current.version:'a newer version')+' is now current'}:{});
}
function poIssues(po){
  syncPOIssues(po);
  return state.issues.filter(i=>i.entityId===po.id&&i.status==='Open')
    .sort((a,b)=>({bad:0,warn:1,info:2})[a.severity]-({bad:0,warn:1,info:2})[b.severity]);
}


/* ===================================================================
   SHIPMENTS

   A shipment is a physical logistics event, not a field on an order.
   One shipment can carry several orders and several labels, and one
   order can be split across several shipments.

   This milestone stops at Delivered. Nothing here creates a lot or
   moves a single label into stock: that is Receiving's job, and it is
   the only normal way inventory comes into existence.
   =================================================================== */
const SHIP_STATUS=['Draft','Booked','Ready for pickup','Shipped','In transit','Customs','Delivered','Cancelled'];
const SHIP_MOVING=['Shipped','In transit','Customs'];      /* physically on its way */
const SHIP_OPEN=['Draft','Booked','Ready for pickup'];     /* assigned but not gone yet */
const SHIP_METHODS=['Express','Air freight','Sea freight','Courier','Supplier delivery','Other'];
const ALLOC_METHODS=[['quantity','By quantity'],['weight','By weight'],['manual','Manual']];
const SHIP_TONE={'Delivered':'ok','Cancelled':'idle','Draft':'idle','Customs':'wait'};
const shipTone=v=>SHIP_TONE[v]||(SHIP_MOVING.indexOf(v)>=0?'wait':'idle');

const linesOfShipment=sid=>state.shipmentLines.filter(l=>l.shipmentId===sid);
const linesOfPO=poId=>state.shipmentLines.filter(l=>l.poId===poId);
const shipmentOf=line=>byId('shipments',line.shipmentId);
const shipActive=sh=>sh&&sh.status!=='Cancelled';

/* ---------- how much of an order is where ---------- */
function poShipping(po){
  let assigned=0,inTransit=0,awaitingReceipt=0,openAssigned=0,
      received=0,accepted=0,quarantined=0,rejected=0,short=0,over=0;
  linesOfPO(po.id).forEach(l=>{
    const sh=shipmentOf(l); if(!shipActive(sh))return;
    const q=num(l.qty), r=shipLineReceipt(l);
    assigned+=q;
    received+=r.received; accepted+=r.accepted; quarantined+=r.quarantined;
    rejected+=r.rejected; short+=r.short; over+=r.over;
    if(sh.status==='Delivered')awaitingReceipt+=r.awaiting;
    else if(SHIP_MOVING.indexOf(sh.status)>=0)inTransit+=q;
    else openAssigned+=q;
  });
  const ordered=num(po.terms&&po.terms.qty);
  return {ordered:ordered,assigned:assigned,openAssigned:openAssigned,inTransit:inTransit,
    awaitingReceipt:awaitingReceipt,received:received,accepted:accepted,
    quarantined:quarantined,rejected:rejected,short:short,over:over,
    remainingToShip:Math.max(0,ordered-assigned),
    awaitingShipment:Math.max(0,ordered-inTransit-awaitingReceipt-received-short)};
}
/* the shipping state an order is really in, derived wherever a shipment
   exists so the two can never drift apart */
function poShippingState(po){
  const s=poShipping(po);
  if(!s.assigned)return {value:po.shipping||'Not Ready',derived:false};
  if(s.awaitingReceipt>=s.ordered)return {value:'Delivered',derived:true};
  if(s.inTransit>0)return {value:'In Transit',derived:true};
  if(s.awaitingReceipt>0)return {value:'Delivered',derived:true};
  return {value:'Ready to Ship',derived:true};
}
/* incoming for a label, split so one quantity is never counted twice */
function incomingFor(labelId){
  const out={ordered:0,awaitingShipment:0,inTransit:0,awaitingReceipt:0,received:0,short:0,incoming:0};
  (state.pos||[]).filter(p=>p.labelId===labelId&&['Confirmed','Active'].indexOf(p.procurement)>=0)
    .forEach(p=>{const s=poShipping(p);
      out.ordered+=s.ordered; out.inTransit+=s.inTransit;
      out.awaitingReceipt+=s.awaitingReceipt; out.awaitingShipment+=s.awaitingShipment;
      out.received+=s.received; out.short+=s.short;});
  /* what is genuinely still coming: received stock is physical now, so it
     drops out of incoming rather than being counted in both places */
  out.incoming=out.awaitingShipment+out.inTransit+out.awaitingReceipt;
  return out;
}

/* ---------- logistics cost ---------- */
function shipCosts(sh){
  const cur=sh.currency||'USD';
  const freight=num(sh.freight), brokerage=num(sh.brokerage), duties=num(sh.duties),
        insurance=num(sh.insurance), other=num(sh.otherCost);
  const total=freight+brokerage+duties+insurance+other;
  const lines=linesOfShipment(sh.id);
  const allocated=lines.reduce((a,l)=>a+num(l.allocatedFreight),0);
  return {currency:cur,freight,brokerage,duties,insurance,other,total,
    allocated:allocated,unallocated:total-allocated,lines:lines};
}
/* Proposes a split. It never writes: applying it is a deliberate action so
   an allocation already agreed cannot be rewritten by a later edit. */
function proposeAllocation(sh){
  const c=shipCosts(sh), lines=c.lines;
  if(!lines.length)return {ok:false,why:'This shipment has nothing in it yet',rows:[]};
  const method=sh.allocationMethod||'quantity';
  if(method==='manual')return {ok:true,method:method,manual:true,
    rows:lines.map(l=>({lineId:l.id,amount:num(l.allocatedFreight)}))};
  const basis=method==='weight'?lines.map(l=>num(l.weight)):lines.map(l=>num(l.qty));
  /* A partial basis would quietly hand the whole cost to whichever lines
     happen to be filled in, so refuse unless every line can be weighed. */
  const missing=basis.filter(v=>!(v>0)).length;
  if(missing)return {ok:false,method:method,rows:[],
    why:method==='weight'
      ?missing+' of the '+lines.length+' lines has no weight. Splitting by weight now would hand the whole cost to the lines that do, so fill them in or split by quantity instead.'
      :missing+' of the '+lines.length+' lines has no quantity.'};
  const sum=basis.reduce((a,b)=>a+b,0);
  if(sum<=0)return {ok:false,method:method,rows:[],why:'Nothing to split the cost across'};
  /* round to cents and give any rounding remainder to the largest line */
  let running=0;
  const rows=lines.map((l,i)=>{
    const share=basis[i]/sum;
    const amt=Math.round(c.total*share*100)/100;
    running+=amt; return {lineId:l.id,amount:amt,share:share};
  });
  const drift=Math.round((c.total-running)*100)/100;
  if(drift&&rows.length){
    let big=0; rows.forEach((r,i)=>{if(basis[i]>basis[big])big=i});
    rows[big].amount=Math.round((rows[big].amount+drift)*100)/100;
  }
  return {ok:true,method:method,rows:rows};
}
function allocationState(sh){
  const c=shipCosts(sh);
  const off=Math.round(c.unallocated*100)/100;
  return {total:c.total,allocated:c.allocated,diff:off,
    clean:Math.abs(off)<0.005,over:off<-0.005,under:off>0.005,currency:c.currency};
}

/* ---------- eligibility ---------- */
function shipEligibility(po,qty){
  const block=[],warn=[];
  const s=poShipping(po);
  if(po.procurement==='Cancelled')block.push('This order is cancelled.');
  if(!num(po.terms&&po.terms.qty))block.push('This order has no quantity.');
  if(s.remainingToShip<=0)block.push('The whole order is already assigned to a shipment.');
  if(qty!=null&&num(qty)>s.remainingToShip)
    block.push('Only '+int(s.remainingToShip)+' of this order is left to ship.');
  if(!po.artworkId)block.push('This order is not bound to an artwork version.');
  if(['Draft','Awaiting Supplier Confirmation'].indexOf(po.procurement)>=0)
    warn.push('The supplier has not confirmed this order yet.');
  if(po.artworkStatus!=='Approved')warn.push('Artwork is '+po.artworkStatus.toLowerCase()+', not approved.');
  const f=poFinancials(po);
  if(f.outstanding>0.005)warn.push(fmtCur(f.outstanding,f.currency)+' is still outstanding on this order.');
  return {block:block,warn:warn,max:s.remainingToShip};
}

/* ---------- derived warnings, never silent status changes ---------- */
function shipEtaDays(sh){
  if(!sh.eta||sh.status==='Delivered'||sh.status==='Cancelled')return 0;
  const d=Math.floor((new Date(today())-new Date(String(sh.eta).slice(0,10)))/86400000);
  return d>0?d:0;
}
function shipWarnings(sh){
  const w=[];
  const late=shipEtaDays(sh);
  if(late)w.push({sev:'bad',text:'ETA passed '+late+' day'+(late===1?'':'s')+' ago and it is still marked '+sh.status.toLowerCase()+'.'});
  if(SHIP_MOVING.indexOf(sh.status)>=0&&!String(sh.tracking||'').trim())
    w.push({sev:'warn',text:'No tracking number on a shipment that has already left.'});
  const a=allocationState(sh);
  if(a.total>0&&a.under)w.push({sev:'warn',text:fmtCur(a.diff,a.currency)+' of the logistics cost is not allocated to any line.'});
  if(a.over)w.push({sev:'bad',text:'Allocations exceed the logistics cost by '+fmtCur(-a.diff,a.currency)+'.'});
  if(!linesOfShipment(sh.id).length)w.push({sev:'warn',text:'Nothing has been added to this shipment yet.'});
  return w;
}
/* freight promised at quote time against what the move actually cost */
function poFreightVariance(po){
  const est=num(po.terms&&po.terms.freight);
  let actual=0,found=false;
  linesOfPO(po.id).forEach(l=>{const sh=shipmentOf(l);
    if(!shipActive(sh))return;
    if(has(l.allocatedFreight)){actual+=num(l.allocatedFreight);found=true;}});
  if(!found)return null;
  return {estimated:est,actual:actual,diff:actual-est,
    pct:est>0?(actual-est)/est*100:null,currency:po.terms.currency||'USD'};
}


/* ===================================================================
   RECEIVING AND QC

   This is the only normal way purchased labels become stock. A shipment
   marked Delivered still creates nothing: only a posted receipt does.

   Per receipt line the physical facts reconcile as
     received = accepted + quarantined + rejected
     short    = expected - received   (only once the receipt is final)
     over     = received - expected
   and the accepted, quarantined and rejected quantities all enter one
   lot, so on hand carries everything physically in our custody while
   available carries only what is genuinely usable.
   =================================================================== */
const RCV_STATUS=['Draft','Inspecting','Ready to post','Posted','Reversed','Cancelled'];
const QC_CHECKS=[
 ['qty','Quantity verified'],['label','Correct label'],['artwork','Correct artwork version'],
 ['dims','Correct dimensions'],['material','Correct material'],['finish','Correct finish'],
 ['adhesive','Correct adhesive'],['winding','Correct roll direction'],['core','Correct core size'],
 ['colour','Colour acceptable'],['align','Print alignment acceptable'],['quality','Print quality acceptable'],
 ['labelDamage','Labels undamaged'],['rollDamage','Rolls undamaged'],['packaging','Packaging undamaged']
];
const QC_RESULTS=['','Pass','Fail','N/A'];
const RCV_TONE={'Posted':'ok','Cancelled':'idle','Reversed':'bad','Draft':'idle','Ready to post':'wait'};
const rcvTone=v=>RCV_TONE[v]||'wait';

const receiptsFor=shipmentId=>state.receipts.filter(r=>r.shipmentId===shipmentId);
const linesOfReceipt=rid_=>state.receiptLines.filter(l=>l.receiptId===rid_);
const receiptOf=line=>byId('receipts',line.receiptId);
const rcvCounts=r=>r&&r.status==='Posted';

/* what one shipment line has actually seen */
function shipLineReceipt(sl){
  const posted=state.receiptLines.filter(rl=>rl.shipmentLineId===sl.id&&rcvCounts(receiptOf(rl)));
  const sum=k=>posted.reduce((a,r)=>a+num(r[k]),0);
  const received=sum('qtyReceived'), accepted=sum('qtyAccepted'),
        quarantined=sum('qtyQuarantined'), rejected=sum('qtyRejected');
  const closed=posted.some(r=>(receiptOf(r)||{}).final);
  const shipped=num(sl.qty);
  const sh=shipmentOf(sl);
  const landed=sh&&shipActive(sh)&&sh.status==='Delivered';
  return {shipped:shipped,received:received,accepted:accepted,quarantined:quarantined,rejected:rejected,
    closed:closed,
    expected:closed?0:Math.max(0,shipped-received),
    awaiting:!landed?0:(closed?0:Math.max(0,shipped-received)),
    short:closed?Math.max(0,shipped-received):0,
    over:Math.max(0,received-shipped)};
}
/* receiving progress on a whole shipment, derived, never a second status */
function shipReceiving(sh){
  const ls=linesOfShipment(sh.id);
  let expected=0,received=0,awaiting=0,closedAll=ls.length>0;
  ls.forEach(l=>{const r=shipLineReceipt(l);
    expected+=r.shipped; received+=r.received; awaiting+=r.awaiting;
    if(!r.closed&&r.expected>0)closedAll=false;});
  const any=state.receipts.some(r=>r.shipmentId===sh.id&&r.status==='Posted');
  return {expected:expected,received:received,awaiting:awaiting,
    state:!any?'Not started':(awaiting>0?'Partial':'Complete'),complete:closedAll&&any};
}

/* ---------- creating ---------- */
function newReceipt(shipmentId){
  const sh=byId('shipments',shipmentId); if(!sh)return null;
  if(sh.status!=='Delivered'){
    if(!confirm(sh.id+' is marked '+sh.status.toLowerCase()+', not delivered.\n\nStart a receipt anyway?'))return null;
  }
  const r={id:nextId('receipt'),shipmentId:sh.id,receivedDate:today(),receivedBy:state.settings.me||'',
    status:'Draft',final:false,notes:'',createdDate:today(),modifiedDate:today(),postedAt:'',
    reversalOf:'',reversedBy:''};
  state.receipts.push(r);
  linesOfShipment(sh.id).forEach(sl=>{
    const info=shipLineReceipt(sl);
    if(info.expected<=0&&info.received>0)return;          /* already fully received */
    const qc={}; QC_CHECKS.forEach(c=>qc[c[0]]={r:'',n:'',a:''});
    state.receiptLines.push({id:nextId('recline'),receiptId:r.id,shipmentLineId:sl.id,
      poId:sl.poId,labelId:sl.labelId,artworkId:sl.artworkId,receivedArtworkId:sl.artworkId,
      qtyExpected:info.expected,qtyReceived:'',qtyAccepted:'',qtyQuarantined:'',qtyRejected:'',
      notes:'',qc:qc});
  });
  logActivity('receipt',r.id,null,'Receipt started against '+sh.id);
  save(true); return r;
}

/* ---------- line arithmetic ---------- */
function rcvLine(rl){
  const recvd=num(rl.qtyReceived), acc=num(rl.qtyAccepted),
        qua=num(rl.qtyQuarantined), rej=num(rl.qtyRejected);
  const expected=num(rl.qtyExpected);
  return {expected:expected,received:recvd,accepted:acc,quarantined:qua,rejected:rej,
    physical:acc+qua+rej,
    balanced:Math.abs(recvd-(acc+qua+rej))<0.0001,
    short:Math.max(0,expected-recvd),over:Math.max(0,recvd-expected)};
}
function qcFailures(rl){
  const out=[];
  QC_CHECKS.forEach(c=>{const v=(rl.qc||{})[c[0]];
    if(v&&v.r==='Fail')out.push({key:c[0],label:c[1],note:v.n||'',affected:num(v.a)});});
  return out;
}
/* what a receipt line costs, from the order snapshot and the shipment
   allocation, never from the live quote */
function rcvLineCost(rl){
  const po=byId('pos',rl.poId); if(!po)return null;
  const sl=byId('shipmentLines',rl.shipmentLineId);
  const t=po.terms, cur=t.currency||'USD', recvd=num(rl.qtyReceived);
  if(recvd<=0)return null;
  const printing=num(t.unitPrice)*recvd;
  const fixedShare=num(t.qty)>0?(num(t.plateFee)+num(t.sampleFee)+num(t.otherCharges))*(recvd/num(t.qty)):0;
  let freightShare=0,basis='Estimated';
  if(sl&&has(sl.allocatedFreight)&&num(sl.qty)>0){
    freightShare=num(sl.allocatedFreight)*(recvd/num(sl.qty));
    const sh=shipmentOf(sl);
    basis=(sh&&sh.allocationFinalized)?'Actual':'Provisional';
  }else if(num(t.qty)>0){
    freightShare=num(t.freight)*(recvd/num(t.qty));
  }
  const pool=printing+fixedShare+freightShare;
  const acc=num(rl.qtyAccepted);
  return {currency:cur,printing:printing,fixed:fixedShare,freight:freightShare,pool:pool,
    perPhysical:pool/recvd,perAccepted:acc>0?pool/acc:null,basis:basis,
    accepted:acc,rejected:num(rl.qtyRejected),short:Math.max(0,num(rl.qtyExpected)-recvd)};
}

/* ---------- validation ---------- */
function validateReceipt(r,final){
  const block=[],warn=[];
  const sh=byId('shipments',r.shipmentId);
  if(!sh)block.push('This receipt is not attached to a shipment.');
  else if(!shipActive(sh))block.push('Its shipment is cancelled.');
  const ls=linesOfReceipt(r.id);
  if(!ls.length)block.push('This receipt has no lines.');
  let anyQty=false,anyExpected=0;
  ls.forEach(rl=>{
    const c=rcvLine(rl), lb=label(rl.labelId)||{}, who=esc(lb.name||rl.labelId);
    anyExpected+=c.expected;
    if(c.received>0)anyQty=true;
    if(c.received<0||c.accepted<0||c.quarantined<0||c.rejected<0)
      block.push(who+': quantities cannot be negative.');
    if(c.received>0&&!c.balanced)
      block.push(who+': '+int(c.received)+' received but '+int(c.physical)
        +' accounted for. Accepted plus quarantined plus rejected has to equal what was received.');
    if(c.over>0)warn.push(who+': '+int(c.over)+' more than expected. That overage will be recorded.');
    if(c.short>0&&final)warn.push(who+': '+int(c.short)+' short. Posting as final closes that as a shortage.');
    const f=qcFailures(rl);
    f.forEach(x=>{
      if(x.key==='artwork')warn.push(who+': the artwork check failed. Confirm what was actually printed before posting.');
      if(!x.affected&&c.accepted===c.received&&c.received>0)
        warn.push(who+': '+x.label.toLowerCase()+' failed but everything received was accepted. Say how many are affected, or accept it deliberately.');
    });
    if(!rl.receivedArtworkId)warn.push(who+': no artwork version recorded for what actually arrived.');
  });
  if(!anyQty)block.push('Nothing has been received on any line.');
  if(anyExpected<=0&&anyQty)
    warn.push('Nothing was still awaiting receipt on this shipment. Anything posted now is recorded as an overage.');
  return {block:block,warn:warn};
}

/* ---------- posting ---------- */
function postReceipt(receiptId,final){
  const r=byId('receipts',receiptId); if(!r)return false;
  if(r.status==='Posted'){alert('This receipt is already posted.');return false;}
  const v=validateReceipt(r,final);
  if(v.block.length){alert('This receipt cannot be posted yet.\n\n'+v.block.join('\n'));return false;}
  const ls=linesOfReceipt(r.id).filter(rl=>num(rl.qtyReceived)>0);
  const summary=ls.map(rl=>{const c=rcvLine(rl),lb=label(rl.labelId)||{};
    return '  '+(lb.name||rl.labelId)+': '+int(c.received)+' received, '+int(c.accepted)+' accepted'
      +(c.quarantined?', '+int(c.quarantined)+' quarantined':'')
      +(c.rejected?', '+int(c.rejected)+' rejected':'')
      +(final&&c.short?', '+int(c.short)+' closed short':'');}).join('\n');
  const msg=(final?'Post as the FINAL receipt?\n\nAnything still missing is closed as a shortage and nothing more will be expected against this shipment.'
                  :'Post a partial receipt?\n\nWhatever is left stays awaiting receipt.')
    +'\n\n'+summary+(v.warn.length?'\n\n'+v.warn.join('\n'):'');
  if(!confirm(msg))return false;

  ls.forEach(rl=>{
    const c=rcvLine(rl), po=byId('pos',rl.poId), sl=byId('shipmentLines',rl.shipmentLineId);
    const cost=rcvLineCost(rl);
    const rows=postMovement(rl.labelId,'Receipt',c.physical,{
      date:r.receivedDate||today(),
      artworkId:rl.receivedArtworkId||rl.artworkId,
      supplierId:po?po.supplierId:null,poId:rl.poId,
      shipmentId:r.shipmentId,receiptId:r.id,receiptLineId:rl.id,
      unitCost:cost?Math.round(cost.perPhysical*1e6)/1e6:null,
      costBasis:cost?cost.basis:null,
      source:LOT_SOURCE.RECEIPT,
      note:'Received on '+r.id});
    const lot=rows&&rows[0]?byId('lots',rows[0].lotId):null;
    if(lot){
      rl.lotId=lot.id;
      if(c.quarantined>0)postMovement(rl.labelId,'Quarantine',c.quarantined,
        {lotId:lot.id,date:r.receivedDate||today(),reason:'Held at receiving',note:'From '+r.id});
      if(c.rejected>0)postMovement(rl.labelId,'Reject',c.rejected,
        {lotId:lot.id,date:r.receivedDate||today(),reason:'Failed inspection at receiving',note:'From '+r.id});
      logActivity('lot',lot.id,rl.labelId,'Lot '+lot.id+' created by '+r.id+', '+int(c.physical)
        +' physical of which '+int(c.accepted)+' usable');
    }
    if(c.short>0&&final)
      logActivity('receipt',r.id,rl.labelId,int(c.short)+' short on '+(label(rl.labelId)||{}).name
        +' closed as a shortage against '+rl.poId);
    if(c.over>0)
      logActivity('receipt',r.id,rl.labelId,int(c.over)+' more than expected received on '+(label(rl.labelId)||{}).name);
    qcFailures(rl).forEach(f=>logActivity('receipt',r.id,rl.labelId,
      'QC failed, '+f.label.toLowerCase()+(f.affected?' on '+int(f.affected)+' labels':'')+(f.note?': '+f.note:'')));
  });
  r.status='Posted'; r.final=!!final; r.postedAt=nowISO(); r.modifiedDate=today();
  logActivity('receipt',r.id,null,(final?'Final receipt':'Partial receipt')+' posted against '+r.shipmentId);
  save(true); return true;
}

/* ---------- reversal ----------
   Only while nothing has been taken out of the lots it created, otherwise
   there is no honest way to undo it and a correction is the right tool. */
function canReverseReceipt(r){
  if(r.status!=='Posted')return 'Only a posted receipt can be reversed.';
  const lots=state.lots.filter(l=>l.receiptId===r.id);
  for(const l of lots){
    const b=lotBalance(l.id);
    if(b.used>0||b.destroyed>0||b.returned>0)
      return 'Stock from '+l.id+' has already been used, destroyed or returned. Reversing would rewrite history that has moved on. Post a correction instead.';
    if(b.reserved>0)return l.id+' has stock reserved against it. Release the reservation first.';
  }
  return null;
}
function reverseReceipt(receiptId){
  const r=byId('receipts',receiptId); if(!r)return false;
  const why=canReverseReceipt(r);
  if(why){alert(why);return false;}
  if(!confirm('Reverse '+r.id+'?\n\nThe receipt stays in the record marked reversed, compensating movements take the stock back out, and the quantity goes back to awaiting receipt.'))return false;
  state.lots.filter(l=>l.receiptId===r.id).forEach(l=>{
    const b=lotBalance(l.id);
    if(b.quarantined>0)postMovement(l.labelId,'Release quarantine',b.quarantined,
      {lotId:l.id,reason:'Receipt reversal',note:'Reverses '+r.id});
    if(b.rejected>0)postMovement(l.labelId,'Release rejection',b.rejected,
      {lotId:l.id,reason:'Receipt reversal',note:'Reverses '+r.id});
    const rem=lotBalance(l.id).remaining;
    if(rem>0)postMovement(l.labelId,'Manual adjustment',-rem,
      {lotId:l.id,reason:'Receipt reversal',note:'Reverses '+r.id});
    l.status='Reversed';
    logActivity('lot',l.id,l.labelId,'Lot emptied by the reversal of '+r.id);
  });
  r.status='Reversed'; r.reversedBy=today(); r.modifiedDate=today();
  logActivity('receipt',r.id,null,'Receipt reversed. The record is kept and the quantity is awaiting receipt again.');
  save(true); return true;
}
function cancelReceipt(receiptId){
  const r=byId('receipts',receiptId); if(!r)return;
  if(r.status==='Posted'){alert('A posted receipt is reversed, not cancelled.');return;}
  if(!confirm('Cancel this draft receipt?'))return;
  r.status='Cancelled'; save(true); render();
}
/* everything a supplier claim will need, ready to be queried */
function receivingDiscrepancies(){
  const out=[];
  state.receipts.filter(r=>r.status==='Posted').forEach(r=>{
    const sh=byId('shipments',r.shipmentId);
    linesOfReceipt(r.id).forEach(rl=>{
      const c=rcvLine(rl), fails=qcFailures(rl);
      const short=r.final?c.short:0;
      if(!short&&!c.rejected&&!c.quarantined&&!fails.length&&!c.over)return;
      const po=byId('pos',rl.poId);
      out.push({receiptId:r.id,receiptLineId:rl.id,shipmentId:r.shipmentId,poId:rl.poId,
        supplierId:po?po.supplierId:null,labelId:rl.labelId,artworkId:rl.receivedArtworkId||rl.artworkId,
        expected:c.expected,received:c.received,short:short,over:c.over,
        rejected:c.rejected,quarantined:c.quarantined,qcFailures:fails,
        evidence:evidenceFor('receipt',r.id).map(e=>e.id),date:r.receivedDate});
    });
  });
  return out;
}

/* ===================================================================
   SHELL AND ROUTING

}

  renderNav(); renderRail(); renderMain(); paintImages(); autogrow();
}
function autogrow(el){
  (el?[el]:[...document.querySelectorAll('textarea.ed')]).forEach(t=>{
    t.style.height='auto';
    const min=parseFloat(getComputedStyle(t).minHeight)||52;
    t.style.height=Math.max(min,t.scrollHeight+2)+'px';});

function renderRail(){

  if(['receiving','receipt'].indexOf(route.view)>=0)return renderRcvRail();
  if(['shipments','shipment'].indexOf(route.view)>=0)return renderShipRail();

        +'<div class="p"><span>'+n+(n===1?' quote':' quotes')+'</span>'

      supplierName(l.preferredSupplierId)].join(' ').toLowerCase().includes(term));
  $('railCount').textContent=list.length+(list.length===1?' label':' labels');
  if(!list.length){

      +(state.labels.length?'Nothing matches that search.':'<b>No labels yet</b>Drop a quote screenshot on the right to start one.')+'</div>';
    return;

function renderMain(){
  switch(route.view){
    case 'home':     return renderHome(false);
    case 'stock':    return renderStock();
    case 'reports':  return renderReports();
    case 'labels':   return renderHome(true);
    case 'label':    return renderLabel(label(route.id));
    case 'receiving':return renderReceiving();
    case 'receipt':  return renderReceipt(byId('receipts',route.id));
    case 'shipments':return renderShipments();
    case 'shipment': return renderShipment(byId('shipments',route.id));
    case 'pos':      return renderPOs();

let homeF={quick:'all',family:'',market:'',supplier:'',status:'',artwork:'',mode:'table',page:1,per:25};

function hpage(n){homeF.page=n;render();}

function labelThumb(lb){
  const a=artwork(lb.currentArtworkId);
  const ev=a&&a.evidenceId?byId('evidence',a.evidenceId):null;
  return ev?ev.imgId:null;
}
/* everything the home table needs about one label, worked out once */
function labelRow(lb){
  const inv=inventory(lb.id), inc=incomingFor(lb.id), st=stockState(lb);
  const best=optionsFor(lb.id)[0], a=artwork(lb.currentArtworkId);
  const pos=(state.pos||[]).filter(p=>p.labelId===lb.id&&['Confirmed','Active'].indexOf(p.procurement)>=0);
  const awaitOrders=pos.filter(p=>poShipping(p).awaitingShipment>0).length;
  const transitShips={}, receiptShips={};
  pos.forEach(p=>linesOfPO(p.id).forEach(l=>{
    const sh=shipmentOf(l); if(!shipActive(sh))return;
    if(SHIP_MOVING.indexOf(sh.status)>=0)transitShips[sh.id]=1;
    if(sh.status==='Delivered'&&shipLineReceipt(l).awaiting>0)receiptShips[sh.id]=1;
  }));
  const bad=issuesFor(lb.id).filter(i=>i.severity==='bad').length;
  return {lb:lb,inv:inv,inc:inc,st:st,best:best,art:a,
    awaitOrders:awaitOrders,transitShips:Object.keys(transitShips).length,
    receiptShips:Object.keys(receiptShips).length,attention:bad,
    statusPill:st==='out'?['Out of Stock','p-red']:st==='low'?['Low Stock','p-amber']
      :lb.status==='Active'?['Active','p-green']:[lb.status,'p-grey']};
}
function allRows(){return state.labels.map(labelRow)}
function quickCounts(rows){
  return {all:rows.length,
    active:rows.filter(r=>r.lb.status==='Active').length,
    low:rows.filter(r=>r.st==='low').length,
    out:rows.filter(r=>r.st==='out').length,
    order:rows.filter(r=>r.inc.incoming>0).length,
    attn:rows.filter(r=>r.attention>0).length};
}
function homeFiltered(rows){
  const term=(($('search')||{}).value||'').toLowerCase();
  return rows.filter(r=>{
    const lb=r.lb;
    if(homeF.quick==='active'&&lb.status!=='Active')return false;
    if(homeF.quick==='low'&&r.st!=='low')return false;
    if(homeF.quick==='out'&&r.st!=='out')return false;
    if(homeF.quick==='order'&&!(r.inc.incoming>0))return false;
    if(homeF.quick==='attn'&&!r.attention)return false;
    if(homeF.family&&lb.family!==homeF.family)return false;
    if(homeF.market&&lb.market!==homeF.market)return false;
    if(homeF.supplier&&lb.preferredSupplierId!==homeF.supplier)return false;
    if(homeF.status&&lb.status!==homeF.status)return false;
    if(homeF.artwork&&(!r.art||r.art.status!==homeF.artwork))return false;
    if(term){
      const blob=[lb.name,lb.sku,lb.family,lb.market,lb.brand,supplierName(lb.preferredSupplierId)].join(' ').toLowerCase();
      if(blob.indexOf(term)<0)return false;
    }
    return true;
  });
}

    +'<div class="ladder head"><span>Quantity</span><span>Price per label ('+sym+')</span>'

      +'<input class="ed n" type="number" value="'+esc(l.qty)+'" data-p="'+LP+'qty" placeholder="10000" aria-label="Quantity">'
      +'<input class="ed n" type="number" step="0.0001" value="'+esc(l.price)+'" data-p="'+LP+'price" placeholder="0.016" aria-label="Price per label">'
      +'<input class="ed n" type="number" step="0.01" value="'+esc(l.ship)+'" data-p="'+LP+'ship" placeholder="50" aria-label="Shipping">'

      +(bad?' style="border-color:#e3a8b9;background:#fdeff3"':'')+'>'

  });
  h+='<button class="tbtn noprint" style="margin-top:4px" onclick="addLine(\''+q.id+'\')">'+ic('plus',13)+'Add a quantity break</button>'
    +'<p class="hint" style="margin:8px 0 18px">Leave the last column blank unless a total was given. Fill it in and the arithmetic gets checked against the unit price.</p>';
