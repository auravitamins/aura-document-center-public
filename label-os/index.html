<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Label OS</title>
<style>

/* ============================================================
   LABEL OS
   Visual language borrowed from a printer's press proof:
   the process ink bar, die-line hairlines, and a job docket.
   Ink is the only colour. Everything else is stock and rule.
   ============================================================ */
:root{
  /* AURAPACK palette, sampled from the approved home screen */
  --stock:#fff;            /* card surface */
  --desk:#fff;             /* page ground */
  --key:#0f1222;           /* primary text */
  --key2:#4a5069;          /* body */
  --key3:#8a90a6;          /* labels and muted */
  --key4:#b6bbc9;          /* placeholder */
  --rule:#ecedf3;          /* card border */
  --rule2:#f3f4f8;         /* row divider */
  --brand:#6a52f2;         /* violet, the one accent */
  --brand-d:#5a41ee;
  --brand-w:#f1f0fe;       /* violet wash */
  --cyan:#194ce2;          /* figures that link somewhere */
  --magenta:#6a52f2;       /* legacy name, now the brand violet */
  --yellow:#fca11c;
  --gain:#16934b;
  --gain-w:#eaf9f0;
  --warnc:#ca430a;
  --warn-w:#fef6e0;
  --flag:#e2151b;
  --flag-w:#feeeee;
  --tint:#f1f0fe;
  --tint-m:#f1f0fe;
  --ink-dark:#141733;
  --r:10px;
  --sh:0 1px 2px rgba(16,20,45,.04), 0 1px 3px rgba(16,20,45,.03);
  --sh2:0 4px 16px rgba(16,20,45,.07);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--key);
  font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.012em}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg.i{vertical-align:-2px;flex-shrink:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px;border-radius:2px}
::selection{background:#ffe9a8}

/* the process ink bar: the one signature mark */
.inkbar{display:flex;height:3px;background:var(--rule)}
.inkbar i{width:34px;flex:none}
.inkbar i:nth-child(1){background:var(--cyan)}
.inkbar i:nth-child(2){background:var(--magenta)}
.inkbar i:nth-child(3){background:var(--yellow)}
.inkbar i:nth-child(4){background:var(--key)}

/* ---------- top rail ---------- */
header{background:var(--stock);border-bottom:1px solid var(--rule);
  padding:0 18px;height:52px;display:flex;align-items:center;gap:14px}
.brand{font-size:14.5px;font-weight:650;letter-spacing:-.02em;display:flex;align-items:baseline;gap:9px}
.brand em{font-style:normal;font-size:11.5px;font-weight:400;color:var(--key3);letter-spacing:0}
.grow{flex:1}
.tbtn{background:var(--stock);border:1px solid var(--rule);border-radius:var(--r);
  padding:6px 11px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
  transition:background .15s,border-color .15s;min-height:30px}
.tbtn:hover{background:#f6f7f9;border-color:#c3c9d1}
.tbtn.key{background:var(--key);border-color:var(--key);color:#fff}
.tbtn.key:hover{background:#25282f}
.search{border:1px solid var(--rule);border-radius:var(--r);padding:6px 10px;width:210px;
  font-size:12.5px;background:var(--stock)}
.search:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px var(--tint)}

/* ---------- shell ---------- */
.app{display:flex;align-items:stretch;min-height:calc(100vh - 55px)}
aside{width:266px;flex-shrink:0;background:var(--stock);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 55px);overflow-y:auto}
main{flex:1;min-width:0;padding:22px 26px 60px}

.railhead{padding:14px 16px 9px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--rule2);position:sticky;top:0;background:var(--stock);z-index:2}
.railhead h2{font-size:12px;font-weight:600;color:var(--key3)}
.jobs{padding:6px 0}
.job{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:10px 15px 10px 14px;border-bottom:1px solid var(--rule2);transition:background .13s}
.job:hover{background:#f7f8fa}
.job.on{background:var(--tint-m);border-left-color:var(--magenta)}
.job .n{font-size:13px;font-weight:550;letter-spacing:-.01em;margin-bottom:2px}
.job .s{font-size:11.5px;color:var(--key3);margin-bottom:5px}
.job .p{font-size:12px;color:var(--key2);display:flex;justify-content:space-between;gap:8px;align-items:center}
.job .p b{font-weight:600}
.job .p .q{color:var(--key3)}

/* ---------- panels ---------- */
.panel{background:var(--stock);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:18px}
.panel>hgroup{padding:12px 16px;border-bottom:1px solid var(--rule2);display:flex;align-items:center;gap:12px}
.panel>hgroup h2{font-size:13.5px;font-weight:600}
.panel>hgroup p{margin:0;font-size:12px;color:var(--key3)}
.panel .in{padding:16px}
.panel .in.flush{padding:0}

/* ---------- the docket: one bold element ---------- */
.docket{background:var(--key);color:#fff;border-radius:var(--r);margin-bottom:18px;overflow:hidden;display:flex}
.docket .edge{width:5px;display:flex;flex-direction:column}
.docket .edge i{flex:1}
.docket .edge i:nth-child(1){background:var(--cyan)}
.docket .edge i:nth-child(2){background:var(--magenta)}
.docket .edge i:nth-child(3){background:var(--yellow)}
.docket .dbody{padding:20px 22px;flex:1;min-width:0}
.docket .cap{font-size:11.5px;color:#8d97a6;margin-bottom:9px}
.docket .fig{font-size:41px;font-weight:600;letter-spacing:-.035em;line-height:1.02}
.docket .fig small{font-size:17px;font-weight:400;color:#9aa4b2;letter-spacing:-.01em;margin-left:8px}
.docket .said{color:#c2cad5;font-size:13.5px;margin-top:7px;max-width:62ch}
.dstats{display:flex;gap:30px;flex-wrap:wrap;margin-top:2px}
.dstat .l{font-size:11.5px;color:#8d97a6}
.dstat .v{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.dstat .v.gain{color:#4ade9f}
.split{display:flex;gap:36px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.inkmix{display:flex;height:8px;border-radius:1px;overflow:hidden;margin-top:18px;background:#272b33}
.inkmix i{display:block;height:100%}
.mixleg{display:flex;gap:20px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:#c2cad5}
.sw{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:6px;vertical-align:0}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--key3);padding:9px 12px;
  border-bottom:1px solid var(--rule);white-space:nowrap;background:#fbfcfd}
td{padding:9px 12px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
tbody tr:hover td{background:#fafbfc}
tr.pick td{background:var(--tint-m)}
tr.pick:hover td{background:#fce6ef}
tr.pick td:first-child{box-shadow:inset 2px 0 0 var(--magenta)}
.scroll{overflow-x:auto}
.fig{font-weight:600}
.dim{color:var(--key3)}
.gain{color:var(--gain)}
.flagtxt{color:var(--flag)}
.thumb40{width:44px;height:30px;object-fit:cover;border:1px solid var(--rule);border-radius:2px;background:#f4f5f7;display:block}

/* stamps: rectangular, like a docket stamp, not a pill */
.stamp{display:inline-block;padding:2px 7px;border-radius:2px;font-size:11px;font-weight:600;
  border:1px solid;white-space:nowrap;line-height:1.45}
.s-Requested{color:var(--key2);border-color:var(--rule);background:#f5f6f8}
.s-Quoted{color:#0069a8;border-color:#b9dcf1;background:#eef7fd}
.s-Negotiating{color:#8a5a00;border-color:#f0dca4;background:#fdf7e6}
.s-Approved{color:var(--gain);border-color:#a9dcc6;background:#eefaf4}
.s-Ordered{color:#0e6a7a;border-color:#a9dbe2;background:#eef9fb}
.s-Received{color:#5b3ea8;border-color:#cfc4ee;background:#f4f1fd}
.s-Rejected{color:var(--flag);border-color:#efbccb;background:#fdeff3}
.best{display:inline-block;background:var(--magenta);color:#fff;font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:2px;letter-spacing:.03em}

/* ---------- inline editing: fill in the docket ---------- */
.f{display:block}
.f>span{display:block;font-size:11.5px;color:var(--key3);margin:0 0 3px 1px}
.ed{width:100%;border:1px solid transparent;border-radius:2px;background:transparent;padding:5px 7px;
  font:inherit;color:inherit;transition:background .13s,border-color .13s;display:block}
.ed:hover{background:#f6f7f9;border-color:var(--rule2)}
.ed:focus{background:var(--stock);border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px var(--tint)}
.ed::placeholder{color:var(--key4)}
.ed.n{text-align:right}
.ed.title{font-size:22px;font-weight:600;letter-spacing:-.025em;padding:5px 7px}
textarea.ed{min-height:78px;resize:vertical;line-height:1.6;max-width:78ch}
select.ed{-webkit-appearance:none;appearance:none;cursor:pointer}
.fgrid{display:grid;gap:13px 18px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.hint{font-size:12px;color:var(--key3);line-height:1.55;max-width:88ch}
.hint b{font-weight:600;color:var(--key2)}

/* ---------- exception report ---------- */
.exc{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--rule2);align-items:flex-start;font-size:13px;line-height:1.5}
.exc:last-child{border-bottom:0}
.exc .mk{width:9px;height:9px;border-radius:1px;flex-shrink:0;margin-top:5px}
.exc.bad .mk{background:var(--flag)} .exc.warn .mk{background:var(--yellow)}
.exc.info .mk{background:var(--rule)} .exc.ok .mk{background:var(--gain)}
.exc.bad{color:#7c0d28} .exc.ok{color:#075239}
.task{display:flex;gap:10px;align-items:center;padding:2px 0;border-bottom:1px solid var(--rule2)}
.task:last-of-type{border-bottom:0}
.task input[type=checkbox]{width:15px;height:15px;flex-shrink:0;accent-color:var(--magenta);cursor:pointer}
.task .ed{flex:1}
.task.done .ed{text-decoration:line-through;color:var(--key4)}

/* ---------- ladder ---------- */
.ladder{display:grid;grid-template-columns:1.05fr 1.15fr 1fr 1fr 30px;gap:8px;align-items:center}
.ladder.head>span{font-size:11.5px;color:var(--key3);text-align:right;padding-right:8px}
.ladder.head>span:last-child{padding-right:0}
.icx{background:none;border:1px solid transparent;border-radius:2px;width:28px;height:28px;
  color:var(--key4);display:inline-flex;align-items:center;justify-content:center;transition:.13s}
.icx:hover{color:var(--flag);background:#fdeff3;border-color:#efbccb}

/* ---------- quote block ---------- */
.quote{border:1px solid var(--rule);border-radius:var(--r);margin-bottom:16px}
.quote>.qh{background:#fbfcfd;border-bottom:1px solid var(--rule2);padding:8px 12px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.quote>.qb{padding:16px}
.sub{font-size:12px;font-weight:600;color:var(--key2);margin:0 0 8px}

/* ---------- evidence ---------- */
.drop{border:1px dashed var(--rule);border-radius:var(--r);background:#fbfcfd;padding:18px;
  text-align:center;transition:.13s;cursor:pointer;color:var(--key2)}
.drop:hover{border-color:var(--cyan);background:var(--tint)}
.drop.over{border-color:var(--magenta);background:var(--tint-m)}
.drop b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.drop small{color:var(--key3);font-size:11.5px}
.shots{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.shot{width:158px;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;position:relative;background:var(--stock)}
.shot img{width:100%;height:104px;object-fit:cover;display:block;cursor:zoom-in;background:#f4f5f7}
.shot .doc{height:104px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:10px;font-size:11.5px;color:var(--key3);background:#f8f9fb;cursor:pointer}
.shot .cap{border-top:1px solid var(--rule2)}
.shot .rm{position:absolute;top:5px;right:5px;background:rgba(19,21,25,.78);color:#fff;border:0;
  border-radius:2px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .13s}
.shot:hover .rm,.shot .rm:focus{opacity:1}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));margin-bottom:18px}
.tile{border:1px solid var(--rule);border-radius:var(--r);padding:11px 13px}
.tile .l{font-size:11.5px;color:var(--key3);margin-bottom:2px}
.tile .v{font-size:23px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.tile .u{font-size:12px;color:var(--key3);margin-top:2px}
.tile .ed{margin:-3px 0 0 -7px;font-size:23px;font-weight:600;letter-spacing:-.025em}
.tile .ed::placeholder{color:var(--key3);font-weight:600}
.tile.low{border-color:#efbccb;background:#fdeff3}
.tile.low .v{color:var(--flag)}
.tile.out{border-color:var(--flag);background:#fdeff3}
.tile.out .v{color:var(--flag)}
.gauge{height:7px;border-radius:1px;background:#eceef1;overflow:hidden;margin-top:9px;position:relative}
.gauge i{display:block;height:100%;background:var(--gain)}
.gauge.low i{background:var(--yellow)} .gauge.out i{background:var(--flag)}
.gauge b{position:absolute;top:-4px;width:2px;height:15px;background:var(--key);border-radius:1px}
.gauge b::after{content:'lead time';position:absolute;top:16px;left:-24px;width:60px;text-align:center;
  font-size:10.5px;color:var(--key3);font-weight:500}
.pubbar{background:#fdf7e6;border-bottom:1px solid #f0dca4;color:#8a5a00;font-size:12.5px;padding:8px 18px}
.blank{padding:38px 20px;text-align:center;color:var(--key3);font-size:13px}
.blank b{display:block;color:var(--key);font-size:14px;font-weight:600;margin-bottom:5px}
.rowbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- overlays ---------- */
.lb{position:fixed;inset:0;background:rgba(19,21,25,.92);display:none;align-items:center;
  justify-content:center;z-index:50;padding:30px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:2px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--key);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:12.5px;
  z-index:60;transition:transform .22s ease}
.toast.on{transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .app{flex-direction:column}
  aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--rule);max-height:270px}
  main{padding:16px}
  .docket .fig{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  header,aside,.drop,.noprint,.inkbar{display:none!important}
  body{background:#fff}
  main{padding:0}
  .panel,.quote{break-inside:avoid;border-color:#c9ced5}
  .docket{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ed{border-color:transparent!important;background:transparent!important}
}

/* ============ v3 additions: navigation, tabs, entities ============ */
.nav{display:flex;gap:2px;margin-left:20px}
.nav a{padding:7px 12px;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--key2);
  text-decoration:none;cursor:pointer;transition:background .13s,color .13s}
.nav a:hover{background:#f4f6f8;color:var(--key)}
.nav a.on{background:var(--key);color:#fff}

.tabs{display:flex;gap:1px;border-bottom:1px solid var(--rule);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;
  font-size:13px;font-weight:550;color:var(--key3);white-space:nowrap;transition:color .13s}
.tabs button:hover{color:var(--key)}
.tabs button.on{color:var(--key);border-bottom-color:var(--magenta)}
.tabs .count{font-size:11px;color:var(--key4);margin-left:5px;font-weight:500}

/* compact summary strip, not oversized cards */
.strip{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--stock);margin-bottom:18px;overflow:hidden}
.strip>div{padding:11px 16px;border-right:1px solid var(--rule2);min-width:118px;flex:1}
.strip>div:last-child{border-right:0}
.strip .l{font-size:11px;color:var(--key3);margin-bottom:2px;white-space:nowrap}
.strip .v{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.strip .v small{font-size:12px;font-weight:400;color:var(--key3);letter-spacing:0}
.strip .v.warn{color:var(--warn,#b45309)} .strip .v.bad{color:var(--flag)} .strip .v.good{color:var(--gain)}
.strip>div.sep{background:#fbfcfd}

/* artwork version rail */
.vers{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.ver{display:flex;gap:14px;padding:13px 15px;border-bottom:1px solid var(--rule2);align-items:flex-start}
.ver:last-child{border-bottom:0}
.ver.cur{background:#fbfdfc;box-shadow:inset 3px 0 0 var(--gain)}
.ver .vt{width:118px;flex-shrink:0}
.ver .vn{font-size:15px;font-weight:650;letter-spacing:-.02em}
.ver .vp{width:104px;height:66px;object-fit:cover;border:1px solid var(--rule);border-radius:2px;
  background:#f4f5f7;flex-shrink:0;cursor:zoom-in;display:block}
.ver .vb{flex:1;min-width:0}
.ver .vmeta{font-size:12px;color:var(--key3);margin-top:3px;line-height:1.6}
.ver .vmeta b{color:var(--key2);font-weight:600}

.a-Draft{color:var(--key2);border-color:var(--rule);background:#f5f6f8}
.a-Pending{color:#8a5a00;border-color:#f0dca4;background:#fdf7e6}
.a-Approved{color:var(--gain);border-color:#a9dcc6;background:#eefaf4}
.a-Superseded{color:#5b3ea8;border-color:#cfc4ee;background:#f4f1fd}
.a-Obsolete{color:var(--flag);border-color:#efbccb;background:#fdeff3}

.conflict{border:1px solid #efbccb;background:#fdeff3;border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.conflict h3{font-size:13.5px;color:#7c0d28;margin-bottom:7px}
.conflict p{margin:0 0 10px;font-size:13px;color:#7c0d28;line-height:1.55}

/* two column detail */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1080px){.cols{grid-template-columns:minmax(0,1fr)}}
.side .panel{margin-bottom:14px}

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);border-radius:99px;
  padding:3px 10px;font-size:12px;background:var(--stock);color:var(--key2)}
.chip.on{border-color:var(--key);background:var(--key);color:#fff}
.mini{font-size:12px;color:var(--key3)}
.link{color:var(--cyan);cursor:pointer;text-decoration:none;font-weight:500}
.link:hover{text-decoration:underline}
.warnrow{background:#fdf7e6;border:1px solid #f0dca4;border-radius:var(--r);padding:10px 13px;
  font-size:12.5px;color:#8a5a00;margin-bottom:14px;line-height:1.55}
.emptyline{color:var(--key3);font-size:13px;padding:14px 0}


/* ============ AURAPACK shell ============ */
.inkbar{display:none}
header{background:var(--stock);border-bottom:1px solid var(--rule);height:72px;padding:0 18px;
  display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;text-decoration:none;padding-right:6px}
.brand .mark{width:38px;height:38px;flex-shrink:0}
.brand b{display:block;font-size:18.5px;font-weight:800;letter-spacing:.05em;color:#0b0f1e;
  line-height:1.05;white-space:nowrap}
.brand em{display:block;font-style:normal;font-size:9.5px;letter-spacing:.075em;color:#6b7282;
  font-weight:500;margin-top:2px;white-space:nowrap}
.nav{display:flex;gap:0;align-items:center;margin-left:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--key2);cursor:pointer;white-space:nowrap;
  transition:background .13s,color .13s}
@media (max-width:1450px){.nav a span{display:none}.nav a{padding:8px}}
.nav a svg{opacity:.75}
.nav a:hover{background:#f7f8fb;color:var(--key)}
.nav a.on{background:var(--brand-w);color:var(--brand)}
.nav a.on svg{opacity:1}
.srch{position:relative;display:flex;align-items:center}

/* ---------- small helpers ---------- */
const $=id=>document.getElementById(id);

  if(!d)return '';

  return MONTHS[+p[1]-1]+' '+(+p[2])+', '+p[0];

   Human readable and never derived from array position. Yearly series for

function pad(n,w){return String(n).padStart(w||4,'0')}
function nextId(kind){
  state.seq=state.seq||{};
  const n=(state.seq[kind]||0)+1; state.seq[kind]=n;
  const yr=new Date().getFullYear();
  switch(kind){
    case 'supplier': return 'SUP-'+pad(n);
    case 'label':    return 'LBL-'+pad(n);
    case 'artwork':  return 'ART-'+pad(n);
    case 'freight':  return 'FR-'+pad(n);
    case 'movement': return 'MV-'+pad(n,5);
    case 'evidence': return 'EV-'+pad(n,5);
    case 'task':     return 'TK-'+pad(n,5);

    case 'request':  return 'QR-'+yr+'-'+pad(n);
    case 'po':       return 'PO-'+yr+'-'+pad(n);
    case 'schedule': return 'PS-'+pad(n,5);
    case 'payment':  return 'PAY-'+yr+'-'+pad(n);
    case 'shipment': return 'SHP-'+yr+'-'+pad(n);
    case 'shipline': return 'SL-'+pad(n,5);
    case 'receipt':  return 'RCV-'+yr+'-'+pad(n);

function putImg(id,blob){return idb().then(d=>new Promise((res,rej)=>{
  const t=d.transaction('img','readwrite');t.objectStore('img').put(blob,id);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function getImg(id){return idb().then(d=>new Promise((res,rej)=>{

function dataToBlobSync(d){
